<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Arsip Pro | Ultimate AI SIKD</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monster: '#39FF14',
                        monsterDark: '#2ebd0d',
                        darkBg: '#0b1121',
                        glassBg: 'rgba(17, 24, 39, 0.7)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #0b1121;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(114,100%,54%,0.05) 0, transparent 50%);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: #39FF14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            outline: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.3); border-radius: 10px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pb-safe-nav { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 1rem)); }
        
        /* Optimasi HP Low-End / Mencegah Lag Animasi */
        #toast {
            will-change: transform, opacity;
        }
        .animate-spin-cpu {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

            };

        };

        // ==========================================
        // FUNGSI FIREBASE
        // ==========================================
        window.firebaseSave = async (payload) => {
            try { 
                 const safePayload = {
                    driveId: String(payload.id || payload.driveId || ''), 
                    nama: String(payload.nama || 'Tanpa Nama'),
                    tipe: String(payload.tipe || 'file'),
                    ukuran: String(payload.ukuran || '-'),
                    kategori: String(payload.kategori || 'FILE'),
                    noSurat: String(payload.noSurat || ''),
                    sifat: String(payload.sifat || 'Biasa'),
                    hal: String(payload.hal || ''),
                    yth: String(payload.yth || ''),
                    url: String(payload.url || '#'),
                    tanggal: String(payload.tanggalSurat || payload.tanggal || new Date().toLocaleDateString('id-ID')), 
                    createdAt: serverTimestamp()
                };

                Object.keys(safePayload).forEach(key => {
                    if (safePayload[key] === undefined || safePayload[key] === null || safePayload[key] === "undefined") {
                        safePayload[key] = '';
                    }
                });

                await push(ref(db, "arsip"), safePayload); 
            } catch(e) { console.error("Firebase Save Error:", e); }
        };

        // ==========================================
        // UI HELPERS (Tampilan Render)
        // ==========================================
        window.createSkeletonCard = () => `
            <div class="glass p-3.5 rounded-2xl flex items-center border border-transparent animate-pulse w-full mb-3">
                <div class="w-10 h-10 rounded-xl bg-slate-700/50 shrink-0"></div>
                <div class="flex-1 space-y-2 ml-3">
                    <div class="h-3 bg-slate-600/50 rounded w-3/4"></div>
                    <div class="h-2 bg-slate-700/50 rounded w-1/4"></div>
                </div>
            </div>`;

        window.createCategoryTab = (label, code, count) => {
            const isActive = window.activeDashboardTab === code;
            const bgClass = isActive ? 'bg-monster text-darkBg shadow-[0_0_10px_rgba(57,255,20,0.3)]' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:border-monster/50';
            const badgeBg = isActive ? 'bg-darkBg/20 text-darkBg' : 'bg-monster/10 text-monster';
            
            return `
            <button type="button" onclick="setDashboardTab('${code}')" class="px-4 py-2 rounded-xl min-w-max flex items-center gap-2 font-bold transition-all ${bgClass}">
                <span class="text-[11px] uppercase">${label}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded-md ${badgeBg}">${count}</span>
            </button>`;

        // ==========================================

        // ==========================================
        window.runBackgroundSync = async function() {
            if(window.isSyncing || window.syncQueue.length === 0) return;
            window.isSyncing = true;
            
            while(window.syncQueue.length > 0) {
                const file = window.syncQueue.shift();
                let finalData = { ...file }; 

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); 

                    const response = await fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ action: 'scanDrive', fileId: file.id || file.driveId }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const res = await response.json();
                        if(res.status === 'success' && res.data && Object.keys(res.data).length > 0) {
                            const data = res.data;
                            finalData.noSurat = data.noSurat || '';
                            finalData.sifat = data.sifat || 'Biasa';
                            finalData.hal = data.hal || '';
                            finalData.yth = data.yth || '';
                            finalData.tanggalSurat = data.tanggalSurat || file.tanggal; 
                            finalData.kategori = data.kategori || file.kategori;
                        }
                    }
                } catch (e) { console.warn("AI Timeout File:", file.nama); }

                finalData.noSurat = finalData.noSurat || '';
                finalData.sifat = finalData.sifat || 'Biasa';
                finalData.hal = finalData.hal || file.nama.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
                finalData.yth = finalData.yth || '';
                finalData.tanggalSurat = finalData.tanggalSurat || file.tanggal;

                await window.firebaseSave(finalData);
                await new Promise(r => setTimeout(r, 1000));
            }
            window.isSyncing = false;
        };

        window.updateMergedData = function() {
            const mergedMap = new Map();
            const scannedDriveIds = new Set(); 
            
            window.firebaseData.forEach(item => {
                mergedMap.set(item.nama, item);
                if(item.driveId) scannedDriveIds.add(item.driveId); 
            });
            
            window.gasData.forEach(item => {
                if(!mergedMap.has(item.nama) && !scannedDriveIds.has(item.id)) {
                    let cat = 'FILE';
                    const lN = item.nama.toLowerCase();
                    if (lN.includes('sk') || lN.includes('keputusan')) cat = 'SK';
                    else if (lN.includes('tugas')) cat = 'SURAT TUGAS';
                    item.kategori = cat;

                    mergedMap.set(item.nama, item); 
                    if(!window.syncQueue.find(q => q.id === item.id)) {
                        window.syncQueue.push(item);
                    }
                }
            });
            
            window.dataArsip = Array.from(mergedMap.values()).sort((a, b) => {
                const tA = a.createdAt ? (typeof a.createdAt === 'number' ? a.createdAt : 0) : (Date.parse(a.tanggal) || 0);
                const tB = b.createdAt ? (typeof b.createdAt === 'number' ? b.createdAt : 0) : (Date.parse(b.tanggal) || 0);
                return tB - tA;
            });

            // PROTEKSI RENDERING KETAT: Mencegah Form Input Terhapus Saat Sync Latar Belakang Berjalan
            if (['dashboard', 'search', 'drive'].includes(window.currentView)) {
                if (window.currentView === 'dashboard') window.renderDashboard();
                else if (window.currentView === 'search') window.renderSearch();
                else if (window.currentView === 'drive') window.renderDrive();
            }

            if(window.syncQueue.length > 0 && !window.isSyncing) {
                window.runBackgroundSync();
            }
        };

        window.fetchData = function(forceFetchDrive = false) {
            if(window.dataArsip.length === 0) {
                window.isLoading = true; 
                window.renderDashboard(); 
            }
            
            if (!window.firebaseListenerSetup) {
                onValue(ref(db, 'arsip'), (snapshot) => {
                    let tempArr = [];
                    snapshot.forEach((child) => tempArr.push({ id: child.key, ...child.val() }));
                    window.firebaseData = tempArr;
                    window.isLoading = false; 
                    window.updateMergedData(); 
                });
                window.firebaseListenerSetup = true;
            }

            if (forceFetchDrive || !window.gasData.length) {
                fetch(GAS_API_URL).then(res => res.json()).then(res => {
                    if(Array.isArray(res)) window.gasData = res;
                    window.updateMergedData(); 
                }).catch(e => { console.warn("Silent Sync Error"); });
            }
        }

            document.getElementById('tab-file').className = isF ? "flex-1 py-3 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg transition-all" : "flex-1 py-3 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            document.getElementById('tab-link').className = !isF ? "flex-1 py-3 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg transition-all" : "flex-1 py-3 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            document.getElementById('mode-file').classList.toggle('hidden', !isF);
            document.getElementById('mode-link').classList.toggle('hidden', isF);
        };

        window.autoDetectLink = (u) => {
            const l = u.toLowerCase();
            document.getElementById('linkCategory').value = (l.includes('sheets') || l.includes('excel')) ? 'DATA' : 'FILE';
        };

        window.handleUpload = async () => {
            const btn = document.getElementById('btnSubmit');
            const iconContainer = document.getElementById('btnIconContainer');
            if(!btn) return;
            
            btn.disabled = true;
            if(iconContainer) iconContainer.innerHTML = window.getIcon('loader', 'w-5 h-5 animate-spin-cpu mx-auto');

            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

            try {
                if(window.activeUploadMode === 'file') {
                    const fInput = document.getElementById('fileInput');
                    if(!fInput || !fInput.files || fInput.files.length === 0) {
                        throw new Error("Pilih berkas terlebih dahulu!");
                    }
                    const file = fInput.files[0];
                    const docCategory = document.getElementById('docCategory').value;
                    
                    const reader = new FileReader();
                    reader.onload = async function(event) {
                        try {
                            const base64Data = event.target.result.split(',')[1];
                            const response = await fetch(GAS_API_URL, { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({ 
                                    action: 'upload', 
                                    fileName: file.name, 
                                    mimeType: file.type, 
                                    fileData: base64Data 
                                })
                            });
                            
                            const res = await response.json();
                            
                            if(res.status === 'success') {
                                window.showToast('Berkas Terunggah! AI sedang membaca berkas.'); 
                                
                                document.getElementById('docName').value = '';
                                document.getElementById('fileInput').value = '';
                                document.getElementById('fileNameDisplay').innerText = "Ketuk untuk memilih Surat/Berkas";
                                document.getElementById('docCategory').value = 'FILE';
                                
                                const newFileRecord = {
                                    id: res.id,
                                    nama: file.name,
                                    tipe: file.name.split('.').pop().toLowerCase(),
                                    url: res.url,
                                    ukuran: (file.size / 1024 / 1024).toFixed(2) + " MB",
                                    tanggal: dateStr,
                                    kategori: docCategory
                                };
                                window.gasData.push(newFileRecord);
                                window.updateMergedData(); 
                            } else { 
                                window.showToast("⚠️ Gagal menyimpan ke Drive", "error"); 
                            }
                        } catch (e) { window.showToast("⚠️ Masalah Jaringan Server GAS", "error"); }
                        finally { resetBtn(); }
                    };
                    reader.readAsDataURL(file);
                } else {
                    const linkUrl = document.getElementById('linkUrl').value;
                    const linkName = document.getElementById('linkName').value;
                    if(!linkName || !linkUrl) throw new Error("Lengkapi data tautan!");
                    
                    await window.firebaseSave({ 
                        driveId: 'link-' + Date.now(),
                        nama: linkName.toUpperCase(), 
                        tipe: 'link', 
                        ukuran: 'Akses Web', 
                        kategori: document.getElementById('linkCategory').value, 
                        url: linkUrl, 
                        tanggal: dateStr,
                    });
                    
                    window.showToast('Tautan Berhasil Disimpan!'); 
                    document.getElementById('linkUrl').value = '';
                    document.getElementById('linkName').value = '';
                    document.getElementById('linkCategory').value = 'DATA';
                    
                    window.fetchData(true); 
                    resetBtn();
                }
            } catch(e) { 
                window.showToast("⚠️ " + e.message, "error"); 
                resetBtn(); 
            }
            
            function resetBtn() { 
                if(btn) {
                    btn.disabled = false; 
                    if(iconContainer) iconContainer.innerHTML = window.getIcon('save', 'w-5 h-5');
                }
            }
        };

        window.filterFiles = (q) => { 
            window.navigate('search'); 
            setTimeout(() => { const i = document.getElementById('searchInput'); if(i) { i.value = q; window.handleSearch(); } }, 50); 
        };

        window.handleSearch = () => {
            const i = document.getElementById('searchInput');
            if(!i) return;
            const q = i.value.toLowerCase();
            
            const res = window.dataArsip.filter(f => 
                f.nama.toLowerCase().includes(q) || 
                (f.kategori && f.kategori.toLowerCase().includes(q)) || 
                (f.tipe && f.tipe.toLowerCase().includes(q)) ||
                (f.noSurat && f.noSurat.toLowerCase().includes(q)) ||
                (f.hal && f.hal.toLowerCase().includes(q)) ||
                (f.yth && f.yth.toLowerCase().includes(q))
            );
            
            const container = document.getElementById('searchResults');
            if(container) container.innerHTML = res.length ? res.map(f => window.createFileCard(f)).join('') : `<div class="col-span-full text-center py-10 opacity-50"><p>Dokumen tidak ditemukan</p></div>`;
        };

        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            const wrapper = document.getElementById('toast-icon-wrapper');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'error') {
                t.classList.remove('bg-monster');
                t.classList.add('bg-red-500', 'text-white');
                if(wrapper) wrapper.innerHTML = window.getIcon('alert-circle', 'w-5 h-5');
            } else {
                t.classList.remove('bg-red-500');
                t.classList.add('bg-monster', 'text-darkBg');
                if(wrapper) wrapper.innerHTML = window.getIcon('check-circle', 'w-5 h-5');
            }

            t.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { 
                t.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                t.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        };

        window.onload = () => window.fetchData(true);
    </script>
</body>
</html>
