<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Arsip Pro | AI SIKD Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monster: '#39FF14',
                        monsterDark: '#2ebd0d',
                        darkBg: '#0b1121',
                        glassBg: 'rgba(17, 24, 39, 0.7)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #0b1121;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(114,100%,54%,0.05) 0, transparent 50%);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: #39FF14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            outline: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.3); border-radius: 10px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pb-safe-nav { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 1rem)); }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden font-sans text-slate-200">

    <div class="flex-1 w-full max-w-md md:max-w-5xl lg:max-w-6xl mx-auto relative flex flex-col h-full glass border-x-0 sm:border-x border-monster/20 sm:my-4 sm:rounded-3xl shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <header class="px-6 pt-6 pb-4 z-10 shrink-0">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">E-<span class="text-monster drop-shadow-[0_0_8px_rgba(57,255,20,0.5)]">Arsip</span></h1>
                    <p class="text-[11px] md:text-xs text-slate-400 mt-0.5 uppercase tracking-tighter">PKH Tapin - AI OCR Smart Reader</p>
                </div>
                <div class="w-10 h-10 rounded-full border border-monster flex items-center justify-center bg-slate-800 shadow-[0_0_15px_rgba(57,255,20,0.2)]">
                    <i data-lucide="brain-circuit" class="text-monster w-5 h-5"></i>
                </div>
            </div>
        </header>

        <main id="app-content" class="flex-1 overflow-y-auto px-6 pb-safe-nav fade-in scroll-smooth">
            <!-- Content render by JS -->
        </main>

        <!-- Navigasi Bawah -->
        <nav class="absolute bottom-0 w-full glass rounded-b-none sm:rounded-b-3xl border-t border-monster/20 z-20">
            <div class="flex justify-between md:justify-center md:gap-24 items-center h-16 px-6 relative">
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center justify-center gap-1 text-monster transition-colors w-14">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Beranda</span>
                </button>
                <button onclick="navigate('search')" id="nav-search" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Cari</span>
                </button>
                
                <div class="w-14 flex justify-center">
                    <button onclick="navigate('input')" class="absolute -top-6 w-14 h-14 rounded-full bg-monster hover:bg-monsterDark text-darkBg flex items-center justify-center shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-transform hover:scale-105 active:scale-95 border-4 border-[#0b1121]">
                        <i data-lucide="plus" class="w-7 h-7"></i>
                    </button>
                </div>

                <button onclick="navigate('drive')" id="nav-drive" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="hard-drive" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Database</span>
                </button>
                <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Sistem</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-monster text-darkBg px-4 py-2.5 rounded-xl font-bold shadow-lg opacity-0 translate-y-[-20px] pointer-events-none z-50 flex items-center gap-2 text-sm w-max transition-all duration-300">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="toast-msg">Berhasil!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // ==========================================
        // CONFIG & API KEYS (Aman, API Key Gemini di-hide di Backend GAS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCCWghHoB-YWITU1eWxWhEYODjuPzVgbl4",
            authDomain: "arsip-pkh-tapin.firebaseapp.com",
            databaseURL: "https://arsip-pkh-tapin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arsip-pkh-tapin",
            storageBucket: "arsip-pkh-tapin.firebasestorage.app",
            messagingSenderId: "394229382365",
            appId: "1:394229382365:web:4fbd373fb5488d22e02f34"
        };

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbynbDyrrPkY6vBkJkryaHItZX1UTsqJQWbHHpHKLRARcVXlSeCf97Xj4wjgdZCL4rrN/exec'; 
        const DEFAULT_DRIVE_FOLDER = "https://drive.google.com/drive/folders/1UU30WaxtqKg8ZuhbyYUgv3tmrRD2OliO?hl=id";

        // Inisialisasi
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global States
        window.dataArsip = [];
        window.firebaseData = [];
        window.gasData = [];
        window.isLoading = true;
        window.activeUploadMode = 'file';

        // Fungsi Global Firebase Push (Digunakan oleh AI Scanner Backend)
        window.firebaseSave = async (payload) => {
            try {
                await push(ref(db, "arsip"), payload);
            } catch(e) {
                console.error("Gagal simpan Firebase:", e);
            }
        };

        // ==========================================
        // UI HELPERS
        // ==========================================
        
        window.createSkeletonCard = () => `
            <div class="glass p-3.5 rounded-2xl flex items-center border border-transparent animate-pulse w-full mb-3">
                <div class="w-10 h-10 rounded-xl bg-slate-700/50 shrink-0"></div>
                <div class="flex-1 space-y-2 ml-3">
                    <div class="h-3 bg-slate-600/50 rounded w-3/4"></div>
                    <div class="h-2 bg-slate-700/50 rounded w-1/4"></div>
                </div>
            </div>`;

        window.createCategoryBtn = (icon, label, colorClass, bgClass, filterCode) => `
            <button onclick="filterFiles('${filterCode}')" class="flex flex-col items-center justify-center p-2.5 rounded-xl glass hover:border-monster/40 transition-all hover:shadow-[0_0_15px_rgba(57,255,20,0.15)] group relative overflow-hidden">
                <div class="${bgClass} ${colorClass} p-2 rounded-lg mb-1.5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="${icon}" class="w-4 h-4 md:w-5 md:h-5"></i>
                </div>
                <span class="text-[8px] md:text-[10px] font-bold text-slate-300 group-hover:text-white transition-colors truncate w-full text-center uppercase">${label}</span>
            </button>`;

        window.createFileCard = (file) => {
            let icon = 'file-text'; let color = 'text-slate-400'; let bg = 'bg-slate-700';
            const tipe = (file.tipe || 'file').toLowerCase();
            
            if(tipe === 'pdf') { color = 'text-red-400'; bg = 'bg-red-400/10'; }
            else if(['doc', 'docx'].includes(tipe)) { color = 'text-blue-400'; bg = 'bg-blue-400/10'; }
            else if(['xls', 'xlsx', 'csv'].includes(tipe)) { icon = 'table'; color = 'text-green-400'; bg = 'bg-green-400/10'; }
            else if(['ppt', 'pptx'].includes(tipe)) { icon = 'presentation'; color = 'text-orange-400'; bg = 'bg-orange-400/10'; }
            else if(['jpg', 'jpeg', 'png', 'image'].includes(tipe)) { icon = 'image'; color = 'text-purple-400'; bg = 'bg-purple-400/10'; }
            else if(['html', 'url', 'link', 'link-2'].includes(tipe)) { icon = 'link-2'; color = 'text-cyan-400'; bg = 'bg-cyan-400/10'; }

            let sifatBadge = '';
            if(file.sifat) {
                const sL = file.sifat.toLowerCase();
                let sCol = 'bg-slate-600/20 border-slate-500/30 text-slate-400';
                if(sL.includes('penting')) sCol = 'bg-orange-500/20 border-orange-500/40 text-orange-400';
                if(sL.includes('rahasia')) sCol = 'bg-red-500/20 border-red-500/40 text-red-400';
                sifatBadge = `<span class="px-1.5 py-0.5 rounded-md border text-[8px] ${sCol}">${file.sifat.toUpperCase()}</span>`;
            }

            // Tombol AI Scan khusus untuk file dari Google Drive yang belum memiliki Atribut OCR
            let aiButton = '';
            if (tipe !== 'link' && tipe !== 'link-2' && !file.noSurat && file.id) {
                aiButton = `
                <button onclick="scanDriveFile('${file.id}', '${file.nama}', '${file.url}', event)" class="mt-2 text-[9px] bg-monster/10 text-monster border border-monster/20 px-2 py-1.5 rounded-md hover:bg-monster hover:text-darkBg flex items-center gap-1 transition-all shadow-[0_0_10px_rgba(57,255,20,0.1)] w-max">
                    <i data-lucide="brain-circuit" class="w-3 h-3"></i> Ekstrak Data dengan AI
                </button>`;
            }

            return `
                <div onclick="window.open('${file.url}', '_blank')" class="glass p-3.5 rounded-2xl flex items-start justify-between border border-transparent hover:border-monster/40 transition-all cursor-pointer group shadow-sm hover:shadow-monster/10">
                    <div class="flex items-start gap-3.5 overflow-hidden w-full relative">
                        <div class="p-2.5 rounded-xl ${bg} ${color} shrink-0 group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-sm text-slate-100 break-words leading-tight group-hover:text-monster transition-colors">${file.nama}</h3>
                            
                            <!-- Atribut Surat Dinamis -->
                            ${file.noSurat ? `<p class="text-[9px] text-slate-400 mt-1 font-medium italic truncate">No: ${file.noSurat}</p>` : ''}
                            ${file.hal ? `<p class="text-[9px] text-slate-400 truncate">Hal: ${file.hal}</p>` : ''}
                            ${file.yth ? `<p class="text-[9px] text-slate-400 truncate">Yth: ${file.yth}</p>` : ''}

                            <div class="flex items-center flex-wrap gap-2 mt-1.5 text-[8px] text-slate-500 font-bold uppercase">
                                <span>${file.tanggal || '-'}</span>
                                <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                                <span class="text-monster/80">${file.kategori || 'FILE'}</span>
                                ${sifatBadge}
                            </div>
                            ${aiButton}
                        </div>
                    </div>
                </div>`;
        };

        // ==========================================
        // LOGIKA CORE (DATA SINKRONISASI)
        // ==========================================

        window.updateMergedData = function() {
            const mergedMap = new Map();
            
            // 1. Data Google Drive
            window.gasData.forEach(item => {
                const lN = item.nama.toLowerCase();
                let cat = 'FILE';
                if (lN.includes('sk') || lN.includes('keputusan')) cat = 'SK';
                else if (lN.includes('tugas')) cat = 'SURAT TUGAS';
                else if (lN.includes('laporan')) cat = 'LAPORAN';
                else if (lN.includes('data')) cat = 'DATA';
                item.kategori = cat;
                mergedMap.set(item.nama, item); 
            });

            // 2. Data Firebase
            window.firebaseData.forEach(item => mergedMap.set(item.nama, item));
            
            // 3. Gabung & Urutkan
            window.dataArsip = Array.from(mergedMap.values()).sort((a, b) => {
                const tA = a.createdAt ? (typeof a.createdAt === 'number' ? a.createdAt : 0) : (Date.parse(a.tanggal) || 0);
                const tB = b.createdAt ? (typeof b.createdAt === 'number' ? b.createdAt : 0) : (Date.parse(b.tanggal) || 0);
                return tB - tA;
            });

            const activeNav = document.querySelector('.nav-btn.text-monster');
            const view = activeNav ? activeNav.id.replace('nav-', '') : 'dashboard';
            window.navigate(view);
        };

        window.fetchData = function() {
            window.isLoading = true;
            onValue(ref(db, 'arsip'), (snapshot) => {
                let tempArr = [];
                snapshot.forEach((child) => tempArr.push({ id: child.key, ...child.val() }));
                window.firebaseData = tempArr;
                window.isLoading = false;
                window.updateMergedData();
            }, (err) => {
                window.isLoading = false;
                window.updateMergedData();
            });

            fetch(GAS_API_URL).then(res => res.json()).then(res => {
                if(Array.isArray(res)) window.gasData = res;
                window.updateMergedData();
            }).catch(e => { console.error(e); window.updateMergedData(); });
        }

        // ==========================================
        // AI OCR ENGINE BACKEND (Aman dari Hackers)
        // ==========================================
        
        window.runAIOCR = async () => {
            const fInput = document.getElementById('fileInput');
            if(!fInput.files[0]) return window.showToast("Pilih file gambar/surat dulu!", "error");

            const btn = document.getElementById('btnAI');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Server AI Membaca...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                const file = fInput.files[0];
                const base64 = await toBase64(file);
                const base64Data = base64.split(',')[1];

                // Memanggil Backend GAS untuk memproses OCR secara tertutup
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: 'scan',
                        mimeType: file.type,
                        fileData: base64Data
                    })
                });

                const res = await response.json();
                if(res.status === 'success' && res.data) {
                    const data = res.data;
                    // Auto-Fill Form
                    if(data.noSurat) document.getElementById('docNoSurat').value = data.noSurat;
                    if(data.sifat) document.getElementById('docSifat').value = data.sifat;
                    if(data.hal) document.getElementById('docHal').value = data.hal;
                    if(data.yth) document.getElementById('docYth').value = data.yth;
                    if(data.tanggal) document.getElementById('docDate').value = data.tanggal;
                    window.showToast("✨ AI Berhasil Membaca Isi Surat!");
                } else {
                    throw new Error("Gagal mengambil data AI");
                }
            } catch (e) {
                console.error(e);
                window.showToast("⚠️ AI Server Sibuk (Ketik Manual)", "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
            }
        };

        // Memindai File Langsung Dari Google Drive
        window.scanDriveFile = async (fileId, fileName, fileUrl, e) => {
            e.stopPropagation(); // Mencegah file terbuka saat tombol diklik
            if(!fileId || fileId === 'undefined') return window.showToast("⚠️ ID File tidak ditemukan di Drive", "error");
            
            window.showToast("🤖 AI Server sedang memindai dokumen...", "success");
            
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: 'scanDrive', fileId: fileId })
                });
                
                const res = await response.json();
                if(res.status === 'success' && res.data) {
                    const data = res.data;
                    const dateStr = data.tanggal || new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    
                    let cat = 'FILE';
                    const halL = (data.hal || '').toLowerCase();
                    if(halL.includes('sk') || halL.includes('keputusan')) cat = 'SK';
                    else if(halL.includes('tugas') || halL.includes('st ')) cat = 'SURAT TUGAS';
                    
                    // Simpan hasil pindaian ke Firebase sebagai metadata permanen
                    await window.firebaseSave({
                        nama: fileName, 
                        tipe: fileName.split('.').pop().toLowerCase(), 
                        ukuran: 'Diindeks AI OCR', 
                        kategori: cat, 
                        noSurat: data.noSurat || '',
                        sifat: data.sifat || 'Biasa',
                        hal: data.hal || '',
                        yth: data.yth || '',
                        url: fileUrl, 
                        tanggal: dateStr, 
                        createdAt: serverTimestamp()
                    });
                    
                    window.showToast("✅ " + fileName + " berhasil di-indeks AI!");
                    window.fetchData();
                } else {
                    throw new Error(res.message || "Gagal OCR");
                }
            } catch (err) { 
                console.error(err);
                window.showToast("⚠️ File di Drive tidak terbaca oleh AI", "error"); 
            }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // ==========================================
        // RENDERERS
        // ==========================================

        window.renderDashboard = function() {
            const cts = { 'SK': 0, 'SURAT TUGAS': 0, 'LAPORAN': 0, 'DATA': 0, 'FILE': 0 };
            window.dataArsip.forEach(f => {
                let c = (f.kategori || 'FILE').toUpperCase();
                if(cts[c] !== undefined) cts[c]++; else cts['FILE']++;
            });

            let statsHtml = Object.keys(cts).map(key => `
                <div onclick="filterFiles('${key.toLowerCase()}')" class="bg-slate-800/80 border border-slate-700 hover:border-monster/50 px-3 py-2 rounded-xl min-w-max flex items-center gap-2 cursor-pointer transition-all">
                    <span class="text-[10px] font-bold text-slate-300 uppercase">${key}</span>
                    <span class="bg-monster/10 text-monster text-[10px] px-1.5 py-0.5 rounded-md font-bold">${cts[key]}</span>
                </div>`).join('');

            const recentList = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(3) : window.dataArsip.slice(0, 5).map(f => window.createFileCard(f)).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2">
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-2xl border border-slate-700 shadow-lg relative overflow-hidden mb-4">
                        <div class="absolute -right-4 -top-4 w-28 h-28 bg-monster/10 rounded-full blur-2xl"></div>
                        <h2 class="text-slate-300 text-xs font-medium uppercase tracking-wider">Total Dokumen Arsip</h2>
                        <div class="flex items-end gap-3 mt-2">
                            <span class="text-4xl font-bold text-white">${window.dataArsip.length}</span>
                            <span class="text-monster text-[10px] font-medium mb-1.5 flex items-center bg-monster/10 px-2 py-0.5 rounded-full border border-monster/20">
                                <i data-lucide="zap" class="w-3 h-3 mr-1"></i> SIKD Auto-OCR Server
                            </span>
                        </div>
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar">${statsHtml}</div>
                    <div class="grid grid-cols-5 gap-2 mb-8">
                        ${window.createCategoryBtn('file-text', 'PDF', 'text-red-400', 'bg-red-400/10', 'pdf')}
                        ${window.createCategoryBtn('file-text', 'Word', 'text-blue-400', 'bg-blue-400/10', 'doc')}
                        ${window.createCategoryBtn('presentation', 'PPT', 'text-orange-400', 'bg-orange-400/10', 'ppt')}
                        ${window.createCategoryBtn('table', 'Excel', 'text-green-400', 'bg-green-400/10', 'xls')}
                        ${window.createCategoryBtn('link-2', 'Tautan', 'text-cyan-400', 'bg-cyan-400/10', 'link')}
                    </div>
                    <h3 class="text-base font-bold text-white mb-4 px-1">Arsip Terbaru</h3>
                    <div class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">${recentList}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderSearch = function() {
            const list = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(5) : window.dataArsip.map(f => window.createFileCard(f)).join('');
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2 h-full flex flex-col">
                    <div class="relative mb-6">
                        <input type="text" id="searchInput" placeholder="Cari nama, No Surat, perihal, Yth..." class="w-full glass-input rounded-2xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-slate-500 shadow-inner" onkeyup="handleSearch()">
                        <i data-lucide="search" class="absolute left-4 top-3.5 text-monster/70 w-5 h-5"></i>
                    </div>
                    <div id="searchResults" class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">${list}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderInput = function() {
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2 pb-6">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="text-monster w-5 h-5"></i> Arsip Baru</h2>
                    <div class="flex gap-2 mb-6 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/50">
                        <button onclick="switchUploadMode('file')" id="tab-file" class="flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg transition-all">Upload Berkas</button>
                        <button onclick="switchUploadMode('link')" id="tab-link" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400 transition-all">Simpan Link</button>
                    </div>
                    <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-5">
                        
                        <!-- TAB FILE FISIK -->
                        <div id="mode-file" class="space-y-5">
                            <div class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center hover:border-monster hover:bg-monster/5 transition-all cursor-pointer relative group">
                                <input type="file" id="fileInput" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileChange(this)">
                                <i data-lucide="file-up" class="w-10 h-10 text-slate-400 mx-auto mb-3 group-hover:text-monster transition-colors"></i>
                                <p class="text-sm text-slate-300 font-medium" id="fileNameDisplay">Pilih Berkas / Foto Surat</p>
                            </div>

                            <!-- TOMBOL AI OCR BACKEND -->
                            <button type="button" id="btnAI" onclick="runAIOCR()" class="w-full bg-slate-800 border border-monster/30 hover:border-monster text-monster text-xs font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                                <i data-lucide="wand-2" class="w-4 h-4"></i> Baca Isi Surat dengan AI Server
                            </button>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="docName" readonly placeholder="Nama File" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-slate-400 cursor-not-allowed">
                                <select id="docCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-monster font-bold">
                                    <option value="FILE">FILE</option><option value="SK">SK</option><option value="SURAT TUGAS">SURAT TUGAS</option><option value="LAPORAN">LAPORAN</option><option value="DATA">DATA</option>
                                </select>
                            </div>

                            <!-- ATRIBUT SURAT -->
                            <div class="bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50 space-y-4">
                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Hasil Scan / Atribut Surat</p>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" id="docNoSurat" placeholder="Nomor Surat" class="w-full glass-input rounded-xl py-3 px-4 text-xs text-white">
                                    <select id="docSifat" class="w-full glass-input rounded-xl py-3 px-4 text-xs text-white font-bold">
                                        <option value="">-- Sifat --</option><option value="Biasa">Biasa</option><option value="Penting">Penting</option><option value="Rahasia">Rahasia</option>
                                    </select>
                                </div>
                                <input type="text" id="docHal" placeholder="Perihal / Hal" class="w-full glass-input rounded-xl py-3 px-4 text-xs text-white">
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" id="docYth" placeholder="Tujuan / Yth" class="w-full glass-input rounded-xl py-3 px-4 text-xs text-white">
                                    <input type="text" id="docDate" placeholder="Tanggal Surat" class="w-full glass-input rounded-xl py-3 px-4 text-xs text-white">
                                </div>
                            </div>
                        </div>

                        <!-- TAB TAUTAN LINK -->
                        <div id="mode-link" class="hidden space-y-5">
                            <input type="url" id="linkUrl" placeholder="https://docs.google.com/spreadsheet/..." class="w-full glass-input rounded-xl py-3.5 px-4 text-sm text-white">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="linkName" placeholder="Judul Tautan" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-sm text-white uppercase font-bold">
                                <select id="linkCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-monster font-bold">
                                    <option value="DATA">DATA</option><option value="FILE">FILE</option><option value="SK">SK</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" id="btnSubmit" class="w-full bg-monster hover:bg-monsterDark text-darkBg font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95">Simpan ke Arsip PKH</button>
                    </form>
                </div>`;
            lucide.createIcons();
        };

        window.renderDrive = () => {
            const list = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(5) : window.dataArsip.map(f => window.createFileCard(f)).join('');
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="folder-kanban" class="text-monster w-5 h-5"></i> Database Terpadu</h2>
                    <div class="glass p-4 rounded-2xl mb-6 flex justify-between items-center shadow-md">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-monster/10 rounded-xl text-monster"><i data-lucide="database" class="w-5 h-5"></i></div>
                            <div><p class="text-sm text-white font-bold leading-tight">Sinkronisasi Realtime</p><p class="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5">${window.dataArsip.length} Dokumen Terdeteksi</p></div>
                        </div>
                        <button onclick="fetchData()" class="p-2.5 text-slate-400 hover:text-monster transition-all"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0 pb-6">${list}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderSettings = () => {
            const savedLink = localStorage.getItem('driveFolderUrl') || DEFAULT_DRIVE_FOLDER;
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="sliders-horizontal" class="text-monster w-5 h-5"></i> Pengaturan Sistem</h2>
                    <div class="glass p-6 rounded-3xl space-y-6">
                        <div class="flex items-center gap-4 p-4 rounded-2xl border border-monster/30 bg-monster/5">
                            <div class="p-2 bg-monster/20 rounded-full text-monster shadow-[0_0_10px_rgba(57,255,20,0.2)]"><i data-lucide="cpu" class="w-5 h-5"></i></div>
                            <div><p class="text-sm font-bold">Mesin AI SIKD Aktif</p><p class="text-[10px] text-slate-400 uppercase mt-0.5">Berjalan di Server Google (Aman)</p></div>
                        </div>
                        <div class="border-t border-slate-700/50 pt-5 space-y-3">
                            <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">Link Folder Google Drive</h3>
                            <div class="flex gap-2">
                                <input type="url" readonly value="${DEFAULT_DRIVE_FOLDER}" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 px-4 text-xs text-slate-400 outline-none">
                                <button onclick="window.open('${DEFAULT_DRIVE_FOLDER}', '_blank')" class="p-3 bg-monster/10 border border-monster/20 text-monster rounded-xl hover:bg-monster/20 transition-all"><i data-lucide="external-link" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            lucide.createIcons();
        };

        // ==========================================
        // HANDLERS
        // ==========================================

        window.navigate = function(view) {
            // FITUR KEAMANAN: Kunci Menu Sistem dengan Password
            if (view === 'settings') {
                const pass = prompt("Masukkan Password Akses Sistem:");
                if (pass !== "admin123") {
                    window.showToast("⚠️ Password Salah! Akses Ditolak.", "error");
                    return;
                }
            }

            document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-monster'); btn.classList.add('text-slate-400'); });
            const act = document.getElementById(`nav-${view}`);
            if(act) { act.classList.remove('text-slate-400'); act.classList.add('text-monster'); }
            if(view === 'dashboard') window.renderDashboard();
            else if(view === 'search') window.renderSearch();
            else if(view === 'input') window.renderInput();
            else if(view === 'drive') window.renderDrive();
            else if(view === 'settings') window.renderSettings();
        };

        window.handleFileChange = (el) => {
            const f = el.files[0];
            if(f) {
                document.getElementById('fileNameDisplay').innerText = f.name;
                document.getElementById('docName').value = f.name.substring(0, f.name.lastIndexOf('.'));
                const l = f.name.toLowerCase();
                let c = 'FILE';
                if(l.includes('sk')) c = 'SK';
                else if(l.includes('tugas')) c = 'SURAT TUGAS';
                else if(l.includes('data')) c = 'DATA';
                document.getElementById('docCategory').value = c;
            }
        };

        window.switchUploadMode = (m) => {
            window.activeUploadMode = m;
            const isF = m === 'file';
            document.getElementById('tab-file').className = isF ? "flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg" : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400";
            document.getElementById('tab-link').className = !isF ? "flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg" : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400";
            document.getElementById('mode-file').classList.toggle('hidden', !isF);
            document.getElementById('mode-link').classList.toggle('hidden', isF);
        };

        window.handleUpload = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin mx-auto"></i>`;
            btn.disabled = true;
            lucide.createIcons();

            const dateStr = document.getElementById('docDate')?.value || new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

            try {
                if(window.activeUploadMode === 'file') {
                    const fInput = document.getElementById('fileInput');
                    const file = fInput.files[0];
                    if(!file) throw new Error("Pilih berkas!");
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        fetch(GAS_API_URL, { 
                            method: 'POST', 
                            body: JSON.stringify({ fileName: file.name, mimeType: file.type, fileData: event.target.result.split(',')[1] }),
                            headers: { 'Content-Type': 'text/plain' }
                        })
                        .then(res => res.json())
                        .then(async res => {
                            if(res.status === 'success') {
                                await push(ref(db, "arsip"), { 
                                    nama: file.name, 
                                    tipe: file.name.split('.').pop().toLowerCase(), 
                                    ukuran: (file.size / 1024 / 1024).toFixed(2) + " MB", 
                                    kategori: document.getElementById('docCategory').value, 
                                    noSurat: document.getElementById('docNoSurat').value,
                                    sifat: document.getElementById('docSifat').value,
                                    hal: document.getElementById('docHal').value,
                                    yth: document.getElementById('docYth').value,
                                    url: res.url, 
                                    tanggal: dateStr, 
                                    createdAt: serverTimestamp() 
                                });
                                window.showToast('Arsip Berhasil Disimpan!'); window.fetchData();
                            } else { window.showToast("⚠️ GAS Gagal", "error"); }
                        }).catch(() => window.showToast("⚠️ Jaringan Gagal", "error")).finally(() => resetBtn());
                    };
                    reader.readAsDataURL(file);
                } else {
                    const name = document.getElementById('linkName').value;
                    const url = document.getElementById('linkUrl').value;
                    if(!name || !url) throw new Error("Lengkapi data!");
                    await push(ref(db, "arsip"), { 
                        nama: name.toUpperCase(), tipe: 'link', ukuran: 'Web', 
                        kategori: document.getElementById('linkCategory').value, 
                        url: url, tanggal: dateStr, createdAt: serverTimestamp() 
                    });
                    window.showToast('Tautan Berhasil!'); window.fetchData(); resetBtn();
                }
            } catch(e) { window.showToast("⚠️ " + e.message, "error"); resetBtn(); }
            function resetBtn() { btn.innerHTML = `Simpan ke Arsip PKH`; btn.disabled = false; lucide.createIcons(); }
        };

        window.filterFiles = (q) => { 
            window.navigate('search'); 
            setTimeout(() => { const i = document.getElementById('searchInput'); if(i) { i.value = q; window.handleSearch(); } }, 100); 
        };

        window.handleSearch = () => {
            const i = document.getElementById('searchInput');
            if(!i) return;
            const q = i.value.toLowerCase();
            const res = window.dataArsip.filter(f => f.nama.toLowerCase().includes(q) || (f.kategori && f.kategori.toLowerCase().includes(q)) || (f.tipe && f.tipe.toLowerCase().includes(q)) || (f.noSurat && f.noSurat.toLowerCase().includes(q)) || (f.hal && f.hal.toLowerCase().includes(q)));
            document.getElementById('searchResults').innerHTML = res.length ? res.map(f => window.createFileCard(f)).join('') : `<div class="col-span-full text-center py-10 opacity-50"><p>Tidak ditemukan</p></div>`;
            lucide.createIcons();
        };

        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'error') {
                t.classList.remove('bg-monster');
                t.classList.add('bg-red-500', 'text-white');
                icon.setAttribute('data-lucide', 'alert-circle');
            } else {
                t.classList.remove('bg-red-500');
                t.classList.add('bg-monster', 'text-darkBg');
                icon.setAttribute('data-lucide', 'check-circle');
            }
            lucide.createIcons();

            t.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { 
                t.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none'); 
                t.classList.remove('opacity-100', 'translate-y-0'); 
            }, 3000);
        };

        window.onload = () => window.fetchData();
    </script>
</body>
</html>
