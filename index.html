<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Arsip Pro | Monster Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config untuk Warna Hijau Monster -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monster: '#39FF14', // Hijau Monster Neon
                        monsterDark: '#2ebd0d',
                        darkBg: '#0b1121', // Latar belakang gelap
                        glassBg: 'rgba(17, 24, 39, 0.7)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #0b1121;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(114,100%,54%,0.05) 0, transparent 50%);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Mencegah efek bounce/refresh saat di-scroll mentok di HP */
        }

        /* Efek Kaca (Glassmorphism) */
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: #39FF14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            outline: none;
        }

        /* Sembunyikan Scrollbar tapi tetap bisa di-scroll */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(57, 255, 20, 0.6); }

        /* Sembunyikan scrollbar khusus untuk navigasi horizontal */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animasi Transisi Halaman */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Padding tambahan untuk area bawah agar tidak tertutup Navigasi/Safe Area iPhone */
        .pb-safe-nav {
            padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 1rem));
        }
        
        .nav-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0.5rem);
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- Kontainer Utama Aplikasi -->
    <div class="flex-1 w-full max-w-md md:max-w-5xl lg:max-w-6xl mx-auto relative flex flex-col h-full glass border-x-0 sm:border-x border-monster/20 sm:my-4 sm:rounded-3xl shadow-2xl shadow-monster/5 overflow-hidden">
        
        <!-- Header -->
        <header class="px-6 pt-6 pb-4 z-10 shrink-0">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">E-<span class="text-monster drop-shadow-[0_0_8px_rgba(57,255,20,0.5)]">Arsip</span></h1>
                    <p class="text-[11px] md:text-xs text-slate-400 mt-0.5">Sistem Manajemen Dokumen</p>
                </div>
                <div class="w-10 h-10 rounded-full border border-monster flex items-center justify-center bg-slate-800 shadow-[0_0_10px_rgba(57,255,20,0.2)]">
                    <i data-lucide="user" class="text-monster w-5 h-5"></i>
                </div>
            </div>
        </header>

        <!-- Area Konten Dinamis -->
        <main id="app-content" class="flex-1 overflow-y-auto px-6 pb-safe-nav fade-in scroll-smooth">
            <!-- Konten akan di-render di sini oleh JavaScript -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full glass rounded-b-none sm:rounded-b-3xl border-t border-monster/20 z-20 nav-safe-bottom">
            <div class="flex justify-between md:justify-center md:gap-24 items-center h-16 px-6 relative">
                
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center justify-center gap-1 text-monster transition-colors w-14">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Beranda</span>
                </button>
                
                <button onclick="navigate('search')" id="nav-search" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Cari</span>
                </button>
                
                <!-- Tombol Tambah Tengah (Floating) Simetris Mutlak -->
                <div class="w-14 flex justify-center">
                    <button onclick="navigate('input')" class="absolute -top-6 w-14 h-14 rounded-full bg-monster hover:bg-monsterDark text-darkBg flex items-center justify-center shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-transform hover:scale-105 active:scale-95 border-4 border-[#0b1121]">
                        <i data-lucide="plus" class="w-7 h-7"></i>
                    </button>
                </div>

                <button onclick="navigate('drive')" id="nav-drive" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="hard-drive" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Drive</span>
                </button>
                
                <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Sistem</span>
                </button>

            </div>
        </nav>
    </div>

    <!-- Notifikasi Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-monster text-darkBg px-4 py-2.5 rounded-xl font-bold shadow-lg shadow-monster/40 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none z-50 flex items-center gap-2 text-sm w-max">
        <i data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="toast-msg">Berhasil!</span>
    </div>

    <!-- Logika Aplikasi (JavaScript) -->
    <script>
        // Inisialisasi Ikon
        lucide.createIcons();

        // --- KONFIGURASI API ---
        // PASTIKAN ANDA MENGGANTI URL DI BAWAH INI DENGAN URL WEB APP GAS ANDA
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbynbDyrrPkY6vBkJkryaHItZX1UTsqJQWbHHpHKLRARcVXlSeCf97Xj4wjgdZCL4rrN/exec'; 

        // --- DATA STATE ---
        let dataArsip = [];
        let isLoading = true;
        window.activeUploadMode = 'file'; // Tab default untuk halaman input

        // --- FUNGSI MENGAMBIL DATA DARI GAS ---
        async function fetchData() {
            isLoading = true;
            
            // Tampilkan Skeleton UI sesuai halaman aktif saat ini
            const activeNav = document.querySelector('.nav-btn.text-monster');
            const view = activeNav ? activeNav.id.replace('nav-', '') : 'dashboard';
            navigate(view); 
            
            try {
                if(GAS_API_URL.includes('AKfycb...')) {
                    console.warn("Menggunakan data Mockup karena URL API belum diganti.");
                    // Delay simulasi untuk memperlihatkan animasi skeleton yang elegan
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                    dataArsip = [
                        // Mockup dengan format link yang terenkripsi di nama file
                        { id: 1, nama: 'Tautan_Database_Warga_2026___LINK___https%3A%2F%2Fdocs.google.com%2Fspreadsheets.html', tipe: 'html', tanggal: '16 Apr 2026', ukuran: '1 KB', kategori: 'DATA', url: '#' },
                        { id: 2, nama: 'SK_Pegawai.pdf', tipe: 'pdf', tanggal: '15 Apr 2026', ukuran: '1.1 MB', kategori: 'SK', url: '#' },
                        { id: 3, nama: 'Undangan_Rapat.docx', tipe: 'docx', tanggal: '14 Apr 2026', ukuran: '500 KB', kategori: 'PEMBERITAHUAN', url: '#' },
                        { id: 4, nama: 'Surat_Tugas_Luar_Kota.pdf', tipe: 'pdf', tanggal: '12 Apr 2026', ukuran: '800 KB', kategori: 'SURAT KELUAR', url: '#' }
                    ];
                } else {
                    const response = await fetch(GAS_API_URL);
                    const result = await response.json();
                    
                    if(Array.isArray(result)) {
                        // Sinkronisasi otomatis: urutkan data agar arsip yang terbaru (terakhir diupload) selalu di paling atas
                        dataArsip = result.reverse(); 
                        try {
                            dataArsip.sort((a, b) => {
                                let dateA = new Date(a.tanggal);
                                let dateB = new Date(b.tanggal);
                                if(!isNaN(dateA) && !isNaN(dateB)) return dateB - dateA;
                                return 0;
                            });
                        } catch(e) {} // Fallback ke reverse jika format tanggal tidak terbaca
                    } else if(result.error) {
                        showToast("Error dari Drive: " + result.error);
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                showToast("Gagal terhubung ke Database Google Drive.");
            } finally {
                isLoading = false;
                navigate(view); // Render data asli
            }
        }

        // --- RENDERER HALAMAN ---
        const contentArea = document.getElementById('app-content');

        // 1. Tampilan Dashboard Utama
        function renderDashboard() {
            let totalFiles = isLoading ? '-' : dataArsip.length;
            
            // Hitung Jumlah Statistik per Kategori
            const catCounts = {
                'SK': 0, 'SURAT MASUK': 0, 'SURAT KELUAR': 0,
                'PEMBERITAHUAN': 0, 'DATA': 0, 'FILE': 0, 'LAINYA': 0
            };
            
            if(!isLoading) {
                dataArsip.forEach(f => {
                    let c = f.kategori ? f.kategori.toUpperCase() : 'FILE';
                    if (catCounts[c] !== undefined) catCounts[c]++;
                    else catCounts['LAINYA']++; // Fallback jika kategori aneh
                });
            }

            // Buat HTML untuk chips statistik
            let catStatsHtml = '';
            if(!isLoading) {
                Object.keys(catCounts).forEach(key => {
                    // Hanya tampilkan jika jumlah > 0 untuk menghemat tempat, atau tampilkan semua jika diinginkan.
                    // Di sini kita tampilkan semua agar user tahu list kategorinya
                    catStatsHtml += `
                        <div onclick="filterFiles('${key.toLowerCase()}')" class="bg-slate-800/80 border border-slate-700 hover:border-monster/50 px-3 py-2 rounded-xl min-w-max flex items-center gap-2 cursor-pointer transition-all hover:shadow-[0_0_10px_rgba(57,255,20,0.15)] group">
                            <span class="text-[11px] font-medium text-slate-300 group-hover:text-white transition-colors">${key}</span>
                            <span class="bg-monster/10 text-monster text-[10px] px-1.5 py-0.5 rounded-md font-bold border border-monster/20">${catCounts[key]}</span>
                        </div>
                    `;
                });
            } else {
                catStatsHtml = `<div class="text-[10px] text-slate-500 italic px-1">Mengkalkulasi statistik kategori...</div>`;
            }
            
            let recentFilesHtml = '';
            if (isLoading) {
                recentFilesHtml = createSkeletonCard() + createSkeletonCard() + createSkeletonCard();
            } else if (dataArsip.length === 0) {
                recentFilesHtml = `<div class="col-span-full text-center py-6 text-slate-500 text-sm">Belum ada dokumen di Drive.</div>`;
            } else {
                recentFilesHtml = dataArsip.slice(0, 3).map(file => createFileCard(file)).join('');
            }

            contentArea.innerHTML = `
                <div class="fade-in">
                    <!-- Kartu Statistik Utama -->
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-2xl border border-slate-700 shadow-lg relative overflow-hidden mb-4 mt-2">
                        <div class="absolute -right-4 -top-4 w-28 h-28 bg-monster/10 rounded-full blur-2xl"></div>
                        <h2 class="text-slate-300 text-xs font-medium uppercase tracking-wider">Total Dokumen Arsip</h2>
                        <div class="flex items-end gap-3 mt-2">
                            <span class="text-4xl font-bold text-white">${totalFiles}</span>
                            <span class="text-monster text-[10px] font-medium mb-1.5 flex items-center bg-monster/10 px-2 py-0.5 rounded-full border border-monster/20">
                                <i data-lucide="cloud-lightning" class="w-3 h-3 mr-1"></i> Tersinkronisasi
                            </span>
                        </div>
                    </div>

                    <!-- Statistik Per Kategori (Horizontal Scrollable) -->
                    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar">
                        ${catStatsHtml}
                    </div>

                    <!-- Kategori Cepat (Berdasarkan Tipe File Ekstensi) -->
                    <div class="grid grid-cols-5 md:grid-cols-8 gap-2 md:gap-3 mb-8">
                        ${createCategoryBtn('pdf', 'PDF', 'text-red-400', 'bg-red-400/10', 'pdf')}
                        ${createCategoryBtn('file-text', 'Word', 'text-blue-400', 'bg-blue-400/10', 'doc')}
                        ${createCategoryBtn('presentation', 'PPT', 'text-orange-400', 'bg-orange-400/10', 'ppt')}
                        ${createCategoryBtn('table', 'Excel', 'text-green-400', 'bg-green-400/10', 'xls')}
                        ${createCategoryBtn('link', 'Tautan', 'text-cyan-400', 'bg-cyan-400/10', 'html')}
                    </div>

                    <!-- Arsip Terbaru -->
                    <div class="flex justify-between items-end mb-4 px-1">
                        <h3 class="text-base font-bold text-white">Arsip Terbaru</h3>
                        <button onclick="navigate('search')" class="text-xs text-monster hover:text-white transition-colors">Lihat Semua</button>
                    </div>
                    <div class="space-y-3 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 pb-2">
                        ${recentFilesHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 2. Tampilan Pencarian (Search/Daftar)
        function renderSearch() {
            let filesHtml = '';
            if (isLoading) {
                filesHtml = createSkeletonCard().repeat(5);
            } else {
                filesHtml = dataArsip.map(file => createFileCard(file)).join('');
            }

            contentArea.innerHTML = `
                <div class="fade-in h-full flex flex-col pt-2">
                    <div class="relative mb-6 shrink-0">
                        <input type="text" id="searchInput" placeholder="Cari nama, kategori, jenis file..." 
                            class="w-full glass-input rounded-2xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-slate-500 shadow-inner"
                            onkeyup="handleSearch()">
                        <i data-lucide="search" class="absolute left-4 top-3.5 text-monster/70 w-5 h-5"></i>
                    </div>
                    
                    <div id="searchResults" class="space-y-3 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 pb-2">
                        ${filesHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();
            if(!isLoading) setTimeout(() => document.getElementById('searchInput')?.focus(), 100);
        }

        // 3. Tampilan Form Input Data (File Fisik & Tautan Link)
        function renderInput() {
            window.activeUploadMode = 'file'; // Reset ke default tiap render
            
            contentArea.innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="cloud-upload" class="text-monster w-5 h-5"></i> Form Input Arsip
                    </h2>

                    <!-- Toggle Tabs Fisik vs Tautan -->
                    <div class="flex gap-2 mb-6 bg-slate-800/80 p-1.5 rounded-xl w-full border border-slate-700/50 relative z-10">
                        <button type="button" onclick="switchUploadMode('file')" id="tab-file" class="flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg transition-all shadow-sm">File Fisik</button>
                        <button type="button" onclick="switchUploadMode('link')" id="tab-link" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">Tautan / Link</button>
                    </div>
                    
                    <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-5">
                        
                        <!-- TAB 1: AREA DROP FILE (FILE FISIK) -->
                        <div id="mode-file" class="space-y-5 fade-in">
                            <div class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center hover:border-monster hover:bg-monster/5 transition-all cursor-pointer relative group" id="dropArea">
                                <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png" required>
                                <div class="bg-slate-800 p-3 rounded-full w-max mx-auto mb-3 group-hover:scale-110 transition-transform group-hover:bg-monster/20">
                                    <i data-lucide="folder-up" class="w-8 h-8 text-slate-400 group-hover:text-monster"></i>
                                </div>
                                <p class="text-sm text-slate-300 font-medium" id="fileNameDisplay">Ketuk untuk memilih file dokumen</p>
                                <p class="text-[10px] text-slate-500 mt-2">Format: PDF, Word, Excel, PPT, JPG (Max 10MB)</p>
                            </div>

                            <div class="md:grid md:grid-cols-2 md:gap-4 space-y-5 md:space-y-0">
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1.5 ml-1 font-medium">Nama Dokumen (Otomatis)</label>
                                    <input type="text" id="docName" readonly placeholder="Terisi otomatis..." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-sm text-slate-400 cursor-not-allowed focus:outline-none">
                                </div>

                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1.5 ml-1 font-medium">Kategori (Auto / Manual)</label>
                                    <select id="docCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-sm text-monster font-semibold focus:outline-none focus:border-monster/50 transition-colors cursor-pointer">
                                        <option value="FILE">FILE</option>
                                        <option value="SURAT MASUK">SURAT MASUK</option>
                                        <option value="SURAT KELUAR">SURAT KELUAR</option>
                                        <option value="PEMBERITAHUAN">PEMBERITAHUAN</option>
                                        <option value="SK">SK</option>
                                        <option value="DATA">DATA</option>
                                        <option value="LAINYA">LAINYA</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- TAB 2: AREA INPUT TAUTAN LINK SPREADSHEET DLL -->
                        <div id="mode-link" class="hidden space-y-5 fade-in">
                            <div>
                                <label class="block text-[11px] text-slate-400 mb-1.5 ml-1 font-medium">URL Tautan (Spreadsheet, G-Drive, Web)</label>
                                <input type="url" id="linkUrl" placeholder="https://docs.google.com/..." class="w-full glass-input rounded-xl py-3.5 px-4 text-sm text-white focus:outline-none" oninput="autoDetectLink(this.value)">
                            </div>
                            
                            <div class="md:grid md:grid-cols-2 md:gap-4 space-y-5 md:space-y-0">
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1.5 ml-1 font-medium">Judul Dokumen Link</label>
                                    <input type="text" id="linkName" placeholder="Contoh: Laporan Data Warga..." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3.5 px-4 text-sm text-white focus:outline-none focus:border-monster/50 transition-colors">
                                </div>

                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1.5 ml-1 font-medium">Kategori Link</label>
                                    <select id="linkCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3.5 px-4 text-sm text-monster font-semibold focus:outline-none focus:border-monster/50 transition-colors cursor-pointer">
                                        <option value="DATA">DATA</option>
                                        <option value="FILE">FILE</option>
                                        <option value="SURAT MASUK">SURAT MASUK</option>
                                        <option value="SURAT KELUAR">SURAT KELUAR</option>
                                        <option value="PEMBERITAHUAN">PEMBERITAHUAN</option>
                                        <option value="SK">SK</option>
                                        <option value="LAINYA">LAINYA</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="btnSubmit" class="w-full bg-monster hover:bg-monsterDark text-darkBg font-bold py-3.5 rounded-xl transition-all shadow-[0_0_20px_rgba(57,255,20,0.25)] mt-6 flex justify-center items-center gap-2 md:w-1/2 md:mx-auto">
                            <i data-lucide="hard-drive-upload" class="w-5 h-5"></i> Simpan ke Database
                        </button>
                    </form>
                </div>
            `;
            lucide.createIcons();

            // Interaksi tab switcher (Definisi fungsi)
            window.switchUploadMode = function(mode) {
                window.activeUploadMode = mode;
                const isFile = mode === 'file';
                
                document.getElementById('tab-file').className = isFile 
                    ? "flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg transition-all shadow-sm"
                    : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
                    
                document.getElementById('tab-link').className = !isFile 
                    ? "flex-1 py-2.5 text-xs font-bold rounded-lg bg-monster text-darkBg transition-all shadow-sm"
                    : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";

                document.getElementById('mode-file').classList.toggle('hidden', !isFile);
                document.getElementById('mode-link').classList.toggle('hidden', isFile);

                document.getElementById('fileInput').required = isFile;
                document.getElementById('linkUrl').required = !isFile;
                document.getElementById('linkName').required = !isFile;
            };

            // Deteksi Kategori Tautan Otomatis
            window.autoDetectLink = function(url) {
                const lowerUrl = url.toLowerCase();
                let cat = 'DATA';
                if(lowerUrl.includes('spreadsheets') || lowerUrl.includes('excel')) cat = 'DATA';
                else if(lowerUrl.includes('document') || lowerUrl.includes('word')) cat = 'FILE';
                else if(lowerUrl.includes('presentation') || lowerUrl.includes('slide')) cat = 'FILE';
                else if(lowerUrl.includes('drive.google.com')) cat = 'FILE';
                document.getElementById('linkCategory').value = cat;
            };

            // Interaksi nama file fisik
            document.getElementById('fileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const fullName = file.name;
                    const nameWithoutExt = fullName.substring(0, fullName.lastIndexOf('.')) || fullName;
                    
                    document.getElementById('fileNameDisplay').innerHTML = `<span class="text-monster font-semibold break-words leading-tight block px-4">${fullName}</span>`;
                    document.getElementById('docName').value = nameWithoutExt;

                    let detectedCategory = 'FILE';
                    const lowerName = nameWithoutExt.toLowerCase();

                    // Algoritma Pintar Deteksi Nama File ke Kategori Baru
                    if (lowerName.includes('sk') || lowerName.includes('keputusan')) detectedCategory = 'SK';
                    else if (lowerName.includes('masuk')) detectedCategory = 'SURAT MASUK';
                    else if (lowerName.includes('keluar')) detectedCategory = 'SURAT KELUAR';
                    else if (lowerName.includes('pemberitahuan') || lowerName.includes('undangan') || lowerName.includes('edaran')) detectedCategory = 'PEMBERITAHUAN';
                    else if (lowerName.includes('data') || lowerName.includes('laporan') || lowerName.includes('keuangan')) detectedCategory = 'DATA';
                    else if (lowerName.includes('lain')) detectedCategory = 'LAINYA';

                    document.getElementById('docCategory').value = detectedCategory;
                }
            });
        }

        // 4. Tampilan Drive (Folder View)
        function renderDrive() {
            let filesHtml = '';
            if (isLoading) {
                filesHtml = createSkeletonCard().repeat(5);
            } else if (dataArsip.length === 0) {
                filesHtml = `<div class="col-span-full text-center py-10 text-slate-500 text-sm">Drive masih kosong.</div>`;
            } else {
                filesHtml = dataArsip.map(file => createFileCard(file)).join('');
            }

            contentArea.innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="folder-kanban" class="text-monster w-5 h-5"></i> Direktori Google Drive
                    </h2>
                    
                    <div class="glass p-4 rounded-2xl mb-6 flex justify-between items-center shadow-md">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-monster/10 rounded-xl border border-monster/20"><i data-lucide="database" class="w-5 h-5 text-monster"></i></div>
                            <div>
                                <p class="text-sm text-white font-bold">Database E-Arsip</p>
                                <p class="text-[10px] text-slate-400 mt-0.5">${isLoading ? 'Memuat...' : dataArsip.length + ' Dokumen Terindeks'}</p>
                            </div>
                        </div>
                        <button onclick="fetchData()" class="p-2.5 text-slate-400 hover:text-monster hover:bg-monster/10 transition-colors rounded-xl border border-transparent hover:border-monster/30">
                            <i data-lucide="refresh-cw" class="w-5 h-5 ${isLoading ? 'animate-spin text-monster' : ''}"></i>
                        </button>
                    </div>
                    
                    <h3 class="text-xs font-semibold text-slate-400 mb-3 px-1 uppercase tracking-wider">Semua File Tersimpan</h3>
                    <div class="space-y-3 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 pb-2">
                        ${filesHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 5. Tampilan Pengaturan
        function renderSettings() {
            const isConnected = !GAS_API_URL.includes('AKfycb...');
            const savedDriveUrl = localStorage.getItem('driveFolderUrl') || '';
            
            contentArea.innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="sliders-horizontal" class="text-monster w-5 h-5"></i> Pengaturan Sistem
                    </h2>
                    
                    <div class="glass p-6 rounded-3xl space-y-6">
                        <!-- Status Koneksi -->
                        <div>
                            <h3 class="text-[11px] font-bold text-slate-400 mb-3 uppercase tracking-wider">Status Integrasi API</h3>
                            <div class="flex items-center gap-4 p-4 rounded-2xl border ${isConnected ? 'bg-monster/5 border-monster/30' : 'bg-red-500/5 border-red-500/30'}">
                                <div class="p-2 rounded-full ${isConnected ? 'bg-monster/20' : 'bg-red-500/20'} shrink-0">
                                    <i data-lucide="${isConnected ? 'link' : 'link-2-off'}" class="w-5 h-5 ${isConnected ? 'text-monster' : 'text-red-400'}"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-bold ${isConnected ? 'text-monster' : 'text-red-400'}">
                                        ${isConnected ? 'Google Drive Terhubung' : 'API Belum Terhubung'}
                                    </p>
                                    <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">
                                        ${isConnected ? 'Aplikasi dapat melakukan sinkronisasi data dua arah dengan aman.' : 'Sistem tidak dapat berfungsi. Harap masukkan URL Google Apps Script.'}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Link Folder Drive Shareable -->
                        <div class="border-t border-slate-700/50 pt-5">
                            <h3 class="text-[11px] font-bold text-slate-400 mb-3 uppercase tracking-wider">Akses Folder Google Drive</h3>
                            <div class="space-y-3">
                                <p class="text-[10px] text-slate-400">Masukkan link folder Drive Anda di sini untuk mempermudah akses dan membagikannya ke rekan kerja.</p>
                                <div class="flex gap-2">
                                    <input type="url" id="driveFolderLink" value="${savedDriveUrl}" placeholder="https://drive.google.com/drive/folders/..." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-2.5 px-4 text-xs text-white focus:outline-none focus:border-monster/50" onchange="saveDriveLink(this.value)">
                                    <button onclick="openDriveLink()" class="p-2.5 bg-monster/10 border border-monster/20 text-monster rounded-xl hover:bg-monster/20 transition-colors shrink-0" title="Buka Folder di Tab Baru">
                                        <i data-lucide="external-link" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="shareDriveLink()" class="p-2.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-xl hover:bg-blue-500/20 transition-colors shrink-0" title="Bagikan / Salin Link">
                                        <i data-lucide="share-2" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Info Aplikasi -->
                        <div class="border-t border-slate-700/50 pt-5">
                            <h3 class="text-[11px] font-bold text-slate-400 mb-3 uppercase tracking-wider">Informasi Teknis</h3>
                            <div class="space-y-3 text-xs text-slate-300">
                                <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-xl">
                                    <span class="flex items-center gap-2"><i data-lucide="tag" class="w-4 h-4 text-slate-500"></i> Versi Aplikasi</span>
                                    <span class="font-bold text-white">v4.0 (Blueprint Final)</span>
                                </div>
                                <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-xl">
                                    <span class="flex items-center gap-2"><i data-lucide="server" class="w-4 h-4 text-slate-500"></i> Basis Data</span>
                                    <span class="font-bold text-white text-right">G-Drive & Apps Script</span>
                                </div>
                                <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-xl">
                                    <span class="flex items-center gap-2"><i data-lucide="code" class="w-4 h-4 text-slate-500"></i> Frontend Engine</span>
                                    <span class="font-bold text-white text-right">Tailwind & Vanilla JS</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // Fungsi khusus Share & Open Drive Folder (Sistem Settings)
        window.saveDriveLink = function(url) {
            localStorage.setItem('driveFolderUrl', url);
            showToast('Link Folder Drive tersimpan di perangkat!');
        };
        window.openDriveLink = function() {
            const url = localStorage.getItem('driveFolderUrl') || document.getElementById('driveFolderLink').value;
            if(url) window.open(url, '_blank');
            else alert('Harap masukkan link folder Google Drive Anda terlebih dahulu pada kolom yang tersedia.');
        };
        window.shareDriveLink = function() {
            const url = localStorage.getItem('driveFolderUrl') || document.getElementById('driveFolderLink').value;
            if(!url) return alert('Harap masukkan link folder Google Drive Anda terlebih dahulu.');
            
            if (navigator.share) {
                navigator.share({
                    title: 'Database E-Arsip Pro',
                    text: 'Berikut adalah tautan untuk mengakses folder Database E-Arsip:',
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(url);
                showToast('Tautan berhasil disalin ke Papan Klip!');
            }
        };

        // --- FUNGSI PENDUKUNG ---

        // HTML Untuk Skeleton Loading (Rangka Pemuatan)
        function createSkeletonCard() {
            return `
                <div class="glass p-3.5 rounded-2xl flex items-center justify-between border border-transparent animate-pulse shadow-sm">
                    <div class="flex items-center gap-3 overflow-hidden w-full">
                        <div class="w-10 h-10 rounded-xl bg-slate-700/50 shrink-0"></div>
                        <div class="flex-1 w-full space-y-2.5">
                            <div class="h-3 bg-slate-600/50 rounded w-3/4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-2 bg-slate-700/50 rounded w-12"></div>
                                <div class="w-1 h-1 rounded-full bg-slate-600/50"></div>
                                <div class="h-2 bg-slate-700/50 rounded w-10"></div>
                                <div class="w-1 h-1 rounded-full bg-slate-600/50"></div>
                                <div class="h-3 bg-slate-700/50 rounded w-16"></div>
                            </div>
                        </div>
                    </div>
                    <div class="w-6 h-6 bg-slate-700/50 rounded-md shrink-0 ml-3"></div>
                </div>
            `;
        }

        // Membuat HTML Card File Aktual
        function createFileCard(file) {
            let icon = 'file'; 
            let color = 'text-slate-400'; 
            let bg = 'bg-slate-700';
            
            const tipe = file.tipe ? file.tipe.toLowerCase() : '';

            // Penyesuaian ikon termasuk ikon Link URL khusus HTML Spreadsheet dsb.
            if(tipe === 'pdf') { icon = 'file-text'; color = 'text-red-400'; bg = 'bg-red-400/10'; }
            else if(['doc', 'docx'].includes(tipe)) { icon = 'file-text'; color = 'text-blue-400'; bg = 'bg-blue-400/10'; }
            else if(['xls', 'xlsx', 'csv'].includes(tipe)) { icon = 'table'; color = 'text-green-400'; bg = 'bg-green-400/10'; }
            else if(['ppt', 'pptx'].includes(tipe)) { icon = 'presentation'; color = 'text-orange-400'; bg = 'bg-orange-400/10'; }
            else if(['jpg', 'jpeg', 'png'].includes(tipe)) { icon = 'image'; color = 'text-purple-400'; bg = 'bg-purple-400/10'; }
            else if(['html', 'url', 'link'].includes(tipe)) { icon = 'link'; color = 'text-cyan-400'; bg = 'bg-cyan-400/10'; }

            let displayName = file.nama;
            let targetUrl = file.url;

            // Logika Dekripsi Tautan Tersembunyi (Langsung Buka Tautan Asli Tanpa Buka Google Drive)
            if (tipe === 'html' && file.nama.includes('___LINK___')) {
                const parts = file.nama.split('___LINK___');
                displayName = parts[0];
                const encodedUrl = parts[1].replace('.html', '');
                try {
                    targetUrl = decodeURIComponent(encodedUrl);
                } catch(e) {
                    targetUrl = file.url;
                }
            } else if (tipe === 'html') {
                // Menghilangkan akhiran ekstensi di tampilan kartu .html jika diupload manual via HTML
                displayName = displayName.replace('.html', '');
            }

            return `
                <div onclick="window.open('${targetUrl}', '_blank')" class="glass p-3.5 rounded-2xl flex items-start justify-between border border-transparent hover:border-monster/40 transition-all cursor-pointer group shadow-sm hover:shadow-monster/10">
                    <div class="flex items-start gap-3.5 overflow-hidden w-full">
                        <div class="p-2.5 rounded-xl ${bg} ${color} shrink-0 group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-sm text-slate-100 break-words leading-snug group-hover:text-monster transition-colors">${displayName}</h3>
                            <div class="flex items-center flex-wrap gap-2 mt-1.5 text-[9px] text-slate-400 font-medium">
                                <span class="whitespace-nowrap">${file.tanggal || '-'}</span>
                                <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                                <span class="whitespace-nowrap">${tipe === 'html' ? 'Tautan Eksternal' : (file.ukuran || '-')}</span>
                                <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                                <span class="text-monster/90 border border-monster/20 bg-monster/5 px-1.5 py-0.5 rounded-md whitespace-nowrap">${file.kategori || 'FILE'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-slate-500 group-hover:text-monster group-hover:bg-monster/10 p-2 rounded-lg shrink-0 ml-2 transition-colors">
                        <i data-lucide="${tipe === 'html' ? 'external-link' : 'download'}" class="w-4 h-4"></i>
                    </div>
                </div>
            `;
        }

        // Tombol Filter Kategori di Dashboard
        function createCategoryBtn(icon, label, colorClass, bgClass, filterCode) {
            return `
                <button onclick="filterFiles('${filterCode}')" class="flex flex-col items-center justify-center p-2.5 rounded-xl glass hover:border-monster/40 transition-all hover:shadow-[0_0_15px_rgba(57,255,20,0.15)] group relative overflow-hidden">
                    <div class="${bgClass} ${colorClass} p-1.5 md:p-2 rounded-lg mb-1.5 group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="${icon}" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </div>
                    <span class="text-[8px] md:text-[10px] font-bold text-slate-300 group-hover:text-white transition-colors truncate w-full text-center">${label}</span>
                </button>
            `;
        }

        // Fungsi Filter Data berdasarkan Kategori (Klik dari Dashboard)
        window.filterFiles = function(type) {
            navigate('search'); // Pindah ke menu search
            setTimeout(() => {
                const searchInput = document.getElementById('searchInput');
                if(searchInput) {
                    // Trik cerdas: Jika type html, tampilkan kata "Link/Tautan" di search bar
                    searchInput.value = type === 'html' ? 'Tautan/Link' : type.toUpperCase();
                    // Eksekusi pencarian dengan override nilai filter agar presisi
                    handleSearch(type); 
                }
            }, 100);
        };

        // Logika Pencarian Real-time
        function handleSearch(filterOverride) {
            let query = filterOverride || document.getElementById('searchInput')?.value.toLowerCase() || "";
            
            // Konversi keyword manusia menjadi keyword sistem untuk pencarian tautan
            if (query.includes('tautan') || query.includes('link')) {
                query = 'html';
            }

            const resultsContainer = document.getElementById('searchResults');
            
            const filtered = dataArsip.filter(file => 
                file.nama.toLowerCase().includes(query) || 
                (file.kategori && file.kategori.toLowerCase().includes(query)) ||
                (file.tipe && file.tipe.toLowerCase().includes(query))
            );

            if(filtered.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-span-full text-center py-10 opacity-60">
                        <div class="bg-slate-800 p-4 rounded-full w-max mx-auto mb-3">
                            <i data-lucide="file-question" class="w-8 h-8 text-slate-400"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-300">Dokumen tidak ditemukan</p>
                        <p class="text-[10px] text-slate-500 mt-1">Coba gunakan kata kunci atau ekstensi lain</p>
                    </div>`;
            } else {
                resultsContainer.innerHTML = filtered.map(file => createFileCard(file)).join('');
            }
            lucide.createIcons();
        }

        // Proses Upload (Bisa File Fisik, Bisa Web Link)
        function handleUpload(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');

            if(GAS_API_URL.includes('AKfycb...')) {
                return alert("Fitur dikunci: Harap masukkan URL API Google Apps Script terlebih dahulu.");
            }

            btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Memproses...`;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.disabled = true;
            lucide.createIcons();

            let payload = {};

            // Logika untuk upload FILE FISIK
            if (window.activeUploadMode === 'file') {
                const fileInput = document.getElementById('fileInput');
                const docCategory = document.getElementById('docCategory').value;

                if(fileInput.files.length === 0) {
                    resetBtn();
                    return alert("Pilih file fisik terlebih dahulu!");
                }

                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Data = event.target.result.split(',')[1];
                    payload = { 
                        fileName: file.name, 
                        mimeType: file.type, 
                        fileData: base64Data,
                        category: docCategory 
                    };
                    sendPayloadToGAS(payload, true); // Eksekusi kirim
                };
                reader.readAsDataURL(file);
            } 
            // Logika cerdas untuk upload TAUTAN LINK (Menyulap link jadi File Web HTML + Enkripsi Target)
            else {
                const urlInput = document.getElementById('linkUrl').value;
                const linkName = document.getElementById('linkName').value;
                const linkCategory = document.getElementById('linkCategory').value;

                if(!urlInput || !linkName) {
                    resetBtn();
                    return alert("Lengkapi URL dan Judul Dokumen Tautan!");
                }

                const htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=${urlInput}"></head><body style="background:#0b1121; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;"><h2>Mengalihkan ke Dokumen...</h2><p>Jika tidak dialihkan otomatis, <a href="${urlInput}" style="color:#39FF14;">klik di sini</a></p></body></html>`;
                const base64Data = btoa(unescape(encodeURIComponent(htmlContent)));

                // Enkripsi target url ke dalam nama file agar frontend dapat mengekstraknya tanpa merubah backend
                const safeUrl = encodeURIComponent(urlInput);
                payload = {
                    fileName: `${linkName}___LINK___${safeUrl}.html`,
                    mimeType: 'text/html',
                    fileData: base64Data,
                    category: linkCategory
                };
                sendPayloadToGAS(payload, false); // Eksekusi kirim
            }

            // Fungsi eksekusi jaringan terpusat
            function sendPayloadToGAS(dataPayload, isPhysicalFile) {
                fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataPayload)
                })
                .then(res => res.json())
                .then(res => {
                    if(res.status === 'success') {
                        showToast(isPhysicalFile ? 'File berhasil diunggah!' : 'Tautan berhasil diamankan!');
                        // Reset Form berdasarkan mode
                        if(isPhysicalFile) {
                            document.getElementById('fileInput').value = '';
                            document.getElementById('docName').value = '';
                            document.getElementById('fileNameDisplay').innerText = 'Ketuk untuk memilih file dokumen';
                        } else {
                            document.getElementById('linkUrl').value = '';
                            document.getElementById('linkName').value = '';
                        }
                        
                        resetBtn();
                        fetchData(); // Sinkronisasi ulang data terbaru di latar belakang
                    } else {
                        alert("Gagal menyimpan ke Drive: " + (res.message || "Unknown Error"));
                        resetBtn();
                    }
                })
                .catch(err => {
                    alert("Kesalahan jaringan. Pastikan URL API benar.");
                    resetBtn();
                });
            }

            function resetBtn() {
                btn.innerHTML = `<i data-lucide="hard-drive-upload" class="w-5 h-5"></i> Simpan ke Database`;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // Sistem Navigasi & Active State
        function navigate(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-monster');
                btn.classList.add('text-slate-400');
            });
            
            const activeBtn = document.getElementById(`nav-${view}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-monster');
            }

            if(view === 'dashboard') renderDashboard();
            else if(view === 'search') renderSearch();
            else if(view === 'input') renderInput();
            else if(view === 'drive') renderDrive();
            else if(view === 'settings') renderSettings();
        }

        // Sistem Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        // Inisialisasi awal
        window.onload = () => {
            fetchData(); 
        };
    </script>
</body>
