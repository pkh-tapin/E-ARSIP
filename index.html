<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Arsip Pro | Monster Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monster: '#39FF14',
                        monsterDark: '#2ebd0d',
                        darkBg: '#0b1121',
                        glassBg: 'rgba(17, 24, 39, 0.7)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #0b1121;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(114,100%,54%,0.05) 0, transparent 50%);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: #39FF14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            outline: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.3); border-radius: 10px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pb-safe-nav { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 1rem)); }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden font-sans text-slate-200">

    <div class="flex-1 w-full max-w-md md:max-w-5xl lg:max-w-6xl mx-auto relative flex flex-col h-full glass border-x-0 sm:border-x border-monster/20 sm:my-4 sm:rounded-3xl shadow-2xl overflow-hidden">
        
        <header class="px-6 pt-6 pb-4 z-10 shrink-0">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">E-<span class="text-monster drop-shadow-[0_0_8px_rgba(57,255,20,0.5)]">Arsip</span></h1>
                    <p class="text-[11px] md:text-xs text-slate-400 mt-0.5 uppercase tracking-tighter">PKH Tapin - Tapin Selatan</p>
                </div>
                <div class="w-10 h-10 rounded-full border border-monster flex items-center justify-center bg-slate-800 shadow-[0_0_15px_rgba(57,255,20,0.2)]">
                    <i data-lucide="user" class="text-monster w-5 h-5"></i>
                </div>
            </div>
        </header>

        <main id="app-content" class="flex-1 overflow-y-auto px-6 pb-safe-nav fade-in scroll-smooth">
            <!-- Konten render by JS -->
        </main>

        <nav class="absolute bottom-0 w-full glass rounded-b-none sm:rounded-b-3xl border-t border-monster/20 z-20">
            <div class="flex justify-between md:justify-center md:gap-24 items-center h-16 px-6 relative">
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center justify-center gap-1 text-monster transition-colors w-14">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Beranda</span>
                </button>
                <button onclick="navigate('search')" id="nav-search" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Cari</span>
                </button>
                
                <div class="w-14 flex justify-center">
                    <button onclick="navigate('input')" class="absolute -top-6 w-14 h-14 rounded-full bg-monster hover:bg-monsterDark text-darkBg flex items-center justify-center shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-transform hover:scale-105 active:scale-95 border-4 border-[#0b1121]">
                        <i data-lucide="plus" class="w-7 h-7"></i>
                    </button>
                </div>

                <button onclick="navigate('drive')" id="nav-drive" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="hard-drive" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Database</span>
                </button>
                <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-monster transition-colors w-14">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">Sistem</span>
                </button>
            </div>
        </nav>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-monster text-darkBg px-4 py-2.5 rounded-xl font-bold shadow-lg opacity-0 translate-y-[-20px] pointer-events-none z-50 flex items-center gap-2 text-sm w-max transition-all duration-300">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="toast-msg">Berhasil!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // ==========================================
        // 1. DATA KONFIGURASI USER
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCCWghHoB-YWITU1eWxWhEYODjuPzVgbl4",
            authDomain: "arsip-pkh-tapin.firebaseapp.com",
            databaseURL: "https://arsip-pkh-tapin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arsip-pkh-tapin",
            storageBucket: "arsip-pkh-tapin.firebasestorage.app",
            messagingSenderId: "394229382365",
            appId: "1:394229382365:web:4fbd373fb5488d22e02f34"
        };

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbynbDyrrPkY6vBkJkryaHItZX1UTsqJQWbHHpHKLRARcVXlSeCf97Xj4wjgdZCL4rrN/exec'; 
        const DEFAULT_DRIVE_FOLDER = "https://drive.google.com/drive/folders/1UU30WaxtqKg8ZuhbyYUgv3tmrRD2OliO?hl=id";

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Global
        window.dataArsip = [];
        window.firebaseData = [];
        window.gasData = [];
        window.isLoading = true;
        window.activeUploadMode = 'file';

        // ==========================================
        // UI HELPERS
        // ==========================================
        
        window.createSkeletonCard = () => `
            <div class="glass p-3.5 rounded-2xl flex items-center border border-transparent animate-pulse w-full mb-3">
                <div class="w-10 h-10 rounded-xl bg-slate-700/50 shrink-0"></div>
                <div class="flex-1 space-y-2 ml-3">
                    <div class="h-3 bg-slate-600/50 rounded w-3/4"></div>
                    <div class="h-2 bg-slate-700/50 rounded w-1/4"></div>
                </div>
            </div>`;

        window.createCategoryBtn = (icon, label, colorClass, bgClass, filterCode) => `
            <button onclick="filterFiles('${filterCode}')" class="flex flex-col items-center justify-center p-2.5 rounded-xl glass hover:border-monster/40 transition-all hover:shadow-[0_0_15px_rgba(57,255,20,0.15)] group relative overflow-hidden">
                <div class="${bgClass} ${colorClass} p-2 rounded-lg mb-1.5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="${icon}" class="w-4 h-4 md:w-5 md:h-5"></i>
                </div>
                <span class="text-[8px] md:text-[10px] font-bold text-slate-300 group-hover:text-white transition-colors truncate w-full text-center uppercase">${label}</span>
            </button>`;

        window.createFileCard = (file) => {
            let icon = 'file-text'; let color = 'text-slate-400'; let bg = 'bg-slate-700';
            const tipe = (file.tipe || 'file').toLowerCase();
            
            if(tipe === 'pdf') { color = 'text-red-400'; bg = 'bg-red-400/10'; }
            else if(['doc', 'docx'].includes(tipe)) { color = 'text-blue-400'; bg = 'bg-blue-400/10'; }
            else if(['xls', 'xlsx', 'csv'].includes(tipe)) { icon = 'table'; color = 'text-green-400'; bg = 'bg-green-400/10'; }
            else if(['ppt', 'pptx'].includes(tipe)) { icon = 'presentation'; color = 'text-orange-400'; bg = 'bg-orange-400/10'; }
            else if(['jpg', 'jpeg', 'png', 'image'].includes(tipe)) { icon = 'image'; color = 'text-purple-400'; bg = 'bg-purple-400/10'; }
            else if(['html', 'url', 'link', 'link-2'].includes(tipe)) { icon = 'link-2'; color = 'text-cyan-400'; bg = 'bg-cyan-400/10'; }

            // Logika Warna Label Sifat
            let sifatBadge = '';
            if(file.sifat) {
                const sifatL = file.sifat.toLowerCase();
                let sColor = 'bg-slate-600 border-slate-500 text-slate-200';
                if(sifatL.includes('penting')) sColor = 'bg-orange-500/20 border-orange-500/40 text-orange-400';
                if(sifatL.includes('rahasia')) sColor = 'bg-red-500/20 border-red-500/40 text-red-400';
                sifatBadge = `<span class="px-1.5 py-0.5 rounded-md border ${sColor}">${file.sifat}</span>`;
            }

            return `
                <div onclick="window.open('${file.url}', '_blank')" class="glass p-3.5 rounded-2xl flex items-start justify-between border border-transparent hover:border-monster/40 transition-all cursor-pointer group shadow-sm hover:shadow-monster/10">
                    <div class="flex items-start gap-3.5 overflow-hidden w-full">
                        <div class="p-2.5 rounded-xl ${bg} ${color} shrink-0 group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-sm text-slate-100 break-words leading-snug group-hover:text-monster transition-colors">${file.nama}</h3>
                            
                            <!-- Metadata Tambahan (Atribut Surat) -->
                            ${file.noSurat ? `<p class="text-[10px] text-slate-300 mt-1 truncate"><span class="text-slate-500 font-medium">No:</span> ${file.noSurat}</p>` : ''}
                            ${file.hal ? `<p class="text-[10px] text-slate-300 truncate"><span class="text-slate-500 font-medium">Hal:</span> ${file.hal}</p>` : ''}
                            ${file.yth ? `<p class="text-[10px] text-slate-300 truncate"><span class="text-slate-500 font-medium">Yth:</span> ${file.yth}</p>` : ''}

                            <div class="flex items-center flex-wrap gap-2 mt-1.5 text-[9px] text-slate-400 font-medium uppercase">
                                <span>${file.tanggal || '-'}</span>
                                <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                                <span class="text-monster/90 border border-monster/20 bg-monster/5 px-1.5 py-0.5 rounded-md">${file.kategori || 'FILE'}</span>
                                ${sifatBadge}
                            </div>
                        </div>
                    </div>
                </div>`;
        };

        // ==========================================
        // LOGIKA CORE (DATA SINKRONISASI)
        // ==========================================

        window.updateMergedData = function() {
            const mergedMap = new Map();
            
            window.gasData.forEach(item => {
                let rawCat = (item.kategori || 'Umum').toUpperCase();
                if (rawCat.includes('SK')) item.kategori = 'SK';
                else if (rawCat.includes('TUGAS')) item.kategori = 'SURAT TUGAS';
                else if (rawCat.includes('LAPORAN')) item.kategori = 'LAPORAN';
                else if (rawCat.includes('KEUANGAN')) item.kategori = 'KEUANGAN';
                else if (rawCat.includes('PEGAWAI')) item.kategori = 'KEPEGAWAIAN';
                else item.kategori = 'FILE';
                mergedMap.set(item.nama, item); 
            });

            window.firebaseData.forEach(item => mergedMap.set(item.nama, item));
            
            window.dataArsip = Array.from(mergedMap.values()).sort((a, b) => {
                const tA = a.createdAt ? (typeof a.createdAt === 'number' ? a.createdAt : 0) : (Date.parse(a.tanggal) || 0);
                const tB = b.createdAt ? (typeof b.createdAt === 'number' ? b.createdAt : 0) : (Date.parse(b.tanggal) || 0);
                return tB - tA;
            });

            const activeNav = document.querySelector('.nav-btn.text-monster');
            const view = activeNav ? activeNav.id.replace('nav-', '') : 'dashboard';
            window.navigate(view);
        };

        window.fetchData = function() {
            window.isLoading = true;
            
            onValue(ref(db, 'arsip'), (snapshot) => {
                let temp = [];
                snapshot.forEach((snap) => temp.push({ id: snap.key, ...snap.val() }));
                window.firebaseData = temp;
                window.isLoading = false;
                window.updateMergedData();
            }, (err) => {
                if(err.message.includes('permission_denied')) {
                    window.showToast("⚠️ Database Firebase Terkunci", "error");
                }
                window.isLoading = false;
                window.updateMergedData();
            });

            fetch(GAS_API_URL).then(res => res.json()).then(res => {
                if(Array.isArray(res)) window.gasData = res;
                window.updateMergedData();
            }).catch(e => {
                window.updateMergedData();
            });
        }

        // ==========================================
        // RENDERER HALAMAN
        // ==========================================

        window.renderDashboard = function() {
            const cts = { 'SK': 0, 'SURAT TUGAS': 0, 'LAPORAN': 0, 'KEUANGAN': 0, 'KEPEGAWAIAN': 0, 'FILE': 0 };
            window.dataArsip.forEach(f => {
                let c = (f.kategori || 'FILE').toUpperCase();
                if(c.includes('SK')) cts['SK']++;
                else if(c.includes('TUGAS')) cts['SURAT TUGAS']++;
                else if(c.includes('LAPORAN')) cts['LAPORAN']++;
                else if(c.includes('KEUANGAN')) cts['KEUANGAN']++;
                else if(c.includes('PEGAWAI')) cts['KEPEGAWAIAN']++;
                else cts['FILE']++;
            });

            const statsChips = Object.keys(cts).map(k => `
                <div onclick="filterFiles('${k.toLowerCase()}')" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl min-w-max flex items-center gap-2 cursor-pointer transition-all hover:border-monster shadow-sm">
                    <span class="text-[10px] font-bold text-slate-300 uppercase">${k}</span>
                    <span class="bg-monster/10 text-monster text-[10px] px-1.5 py-0.5 rounded-md font-bold">${cts[k]}</span>
                </div>`).join('');

            const recentList = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(3) : window.dataArsip.slice(0, 5).map(f => window.createFileCard(f)).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="fade-in">
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-2xl border border-slate-700 shadow-lg relative overflow-hidden mb-4 mt-2">
                        <div class="absolute -right-4 -top-4 w-28 h-28 bg-monster/10 rounded-full blur-2xl"></div>
                        <h2 class="text-slate-300 text-xs font-medium uppercase tracking-wider">Total Dokumen Arsip</h2>
                        <div class="flex items-end gap-3 mt-2">
                            <span class="text-4xl font-bold text-white">${window.dataArsip.length}</span>
                            <span class="text-monster text-[10px] font-medium mb-1.5 flex items-center bg-monster/10 px-2 py-0.5 rounded-full border border-monster/20">
                                <i data-lucide="radio" class="w-3 h-3 mr-1 animate-pulse"></i> Sync: Realtime Active
                            </span>
                        </div>
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar">${statsChips}</div>
                    <div class="grid grid-cols-5 gap-2 mb-8">
                        ${window.createCategoryBtn('file-text', 'PDF', 'text-red-400', 'bg-red-400/10', 'pdf')}
                        ${window.createCategoryBtn('file-text', 'Word', 'text-blue-400', 'bg-blue-400/10', 'doc')}
                        ${window.createCategoryBtn('presentation', 'PPT', 'text-orange-400', 'bg-orange-400/10', 'ppt')}
                        ${window.createCategoryBtn('table', 'Excel', 'text-green-400', 'bg-green-400/10', 'xls')}
                        ${window.createCategoryBtn('link-2', 'Tautan', 'text-cyan-400', 'bg-cyan-400/10', 'link')}
                    </div>
                    <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                        <i data-lucide="clock" class="w-5 h-5 text-monster"></i> Berkas Terbaru
                    </h3>
                    <div class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">${recentList}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderSearch = function() {
            const list = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(5) : window.dataArsip.map(f => window.createFileCard(f)).join('');
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2 h-full flex flex-col">
                    <div class="relative mb-6">
                        <input type="text" id="searchInput" placeholder="Cari nama, No Surat, perihal, kategori..." class="w-full glass-input rounded-2xl py-4 pl-12 pr-4 text-sm text-white placeholder-slate-500 shadow-inner" onkeyup="handleSearch()">
                        <i data-lucide="search" class="absolute left-4 top-4 text-monster/70 w-5 h-5"></i>
                    </div>
                    <div id="searchResults" class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">${list}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderInput = function() {
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2 pb-6">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="cloud-upload" class="text-monster w-5 h-5"></i> Input Arsip PKH</h2>
                    <div class="flex gap-2 mb-6 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/50 shadow-inner">
                        <button onclick="switchUploadMode('file')" id="tab-file" class="flex-1 py-3 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg transition-all">File Fisik</button>
                        <button onclick="switchUploadMode('link')" id="tab-link" class="flex-1 py-3 text-xs font-bold rounded-lg text-slate-400 transition-all">Tautan Link</button>
                    </div>
                    <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-5">
                        
                        <!-- TAB FILE FISIK -->
                        <div id="mode-file" class="space-y-5">
                            <div class="border-2 border-dashed border-slate-600 rounded-2xl p-6 text-center hover:border-monster hover:bg-monster/5 transition-all cursor-pointer relative group">
                                <input type="file" id="fileInput" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileChange(this)">
                                <i data-lucide="folder-up" class="w-10 h-10 text-slate-400 mx-auto mb-3 group-hover:text-monster transition-colors"></i>
                                <p class="text-sm text-slate-300 font-medium" id="fileNameDisplay">Ketuk untuk memilih file Berkas</p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Nama File (Auto)</label>
                                    <input type="text" id="docName" readonly placeholder="Auto..." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-slate-400 cursor-not-allowed">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Kategori Utama</label>
                                    <select id="docCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-monster font-bold focus:outline-none">
                                        <option value="FILE">FILE</option><option value="SK">SK</option><option value="SURAT TUGAS">SURAT TUGAS</option><option value="LAPORAN">LAPORAN</option><option value="KEUANGAN">KEUANGAN</option><option value="KEPEGAWAIAN">KEPEGAWAIAN</option>
                                    </select>
                                </div>
                            </div>

                            <!-- ATRIBUT SURAT BARU -->
                            <div class="border-t border-slate-700/50 pt-4 mt-4 space-y-4">
                                <p class="text-[11px] font-bold text-monster uppercase flex items-center gap-1.5"><i data-lucide="text-quote" class="w-3.5 h-3.5"></i> Atribut Surat (Opsional)</p>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" id="docNoSurat" placeholder="Nomor Surat" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-white outline-none focus:border-monster/50">
                                    <select id="docSifat" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-slate-300 font-bold focus:outline-none">
                                        <option value="">-- Sifat Surat --</option>
                                        <option value="Biasa">Biasa</option>
                                        <option value="Penting">Penting</option>
                                        <option value="Rahasia">Rahasia</option>
                                        <option value="Sangat Rahasia">Sangat Rahasia</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" id="docHal" placeholder="Perihal / Hal" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-white outline-none focus:border-monster/50">
                                    <input type="text" id="docYth" placeholder="Tujuan / Yth." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3 px-4 text-xs text-white outline-none focus:border-monster/50">
                                </div>
                            </div>
                        </div>

                        <!-- TAB TAUTAN LINK -->
                        <div id="mode-link" class="hidden space-y-5">
                            <div class="space-y-1">
                                <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Link Spreadsheet / Drive</label>
                                <input type="url" id="linkUrl" placeholder="https://docs.google.com/..." class="w-full glass-input rounded-xl py-4 px-4 text-sm text-white" oninput="autoDetectLink(this.value)">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1">
                                    <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Judul Tautan</label>
                                    <input type="text" id="linkName" placeholder="Contoh: DATA PKH 2026" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3.5 px-4 text-sm text-white uppercase font-bold">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Kategori</label>
                                    <select id="linkCategory" class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl py-3.5 px-4 text-xs text-monster font-bold">
                                        <option value="DATA">DATA</option><option value="FILE">FILE</option><option value="SK">SK</option><option value="LAPORAN">LAPORAN</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="submit" id="btnSubmit" class="w-full bg-monster hover:bg-monsterDark text-darkBg font-bold py-4 rounded-xl shadow-lg shadow-monster/20 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Arsip Lengkap
                        </button>
                    </form>
                </div>`;
            lucide.createIcons();
        };

        window.renderDrive = () => {
            const list = window.isLoading && window.dataArsip.length === 0 ? window.createSkeletonCard().repeat(5) : window.dataArsip.map(f => window.createFileCard(f)).join('');
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="folder-kanban" class="text-monster w-5 h-5"></i> Database Terpadu</h2>
                    <div class="glass p-4 rounded-2xl mb-6 flex justify-between items-center shadow-md">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-monster/10 rounded-xl border border-monster/20 text-monster"><i data-lucide="database" class="w-5 h-5"></i></div>
                            <div><p class="text-sm text-white font-bold leading-tight">Sinkronisasi Realtime</p><p class="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5">${window.dataArsip.length} Dokumen Terdeteksi</p></div>
                        </div>
                        <button onclick="fetchData()" class="p-3 text-slate-400 hover:text-monster hover:bg-monster/10 rounded-xl transition-all"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0 pb-6">${list}</div>
                </div>`;
            lucide.createIcons();
        };

        window.renderSettings = () => {
            const savedLink = localStorage.getItem('driveFolderUrl') || DEFAULT_DRIVE_FOLDER;
            document.getElementById('app-content').innerHTML = `
                <div class="fade-in pt-2">
                    <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="sliders-horizontal" class="text-monster w-5 h-5"></i> Pengaturan</h2>
                    <div class="glass p-6 rounded-3xl space-y-6">
                        <div class="flex items-center gap-4 p-4 rounded-2xl border border-monster/30 bg-monster/5">
                            <div class="p-2 bg-monster/20 rounded-full text-monster shadow-[0_0_10px_rgba(57,255,20,0.2)]"><i data-lucide="database" class="w-5 h-5"></i></div>
                            <div><p class="text-sm font-bold">Firebase Realtime Live</p><p class="text-[10px] text-slate-400 uppercase">PKH Tapin - PKH Tapin Selatan</p></div>
                        </div>
                        <div class="border-t border-slate-700/50 pt-5 space-y-3">
                            <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">Link Utama Folder Google Drive</h3>
                            <div class="flex gap-2">
                                <input type="url" readonly value="${DEFAULT_DRIVE_FOLDER}" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 px-4 text-xs text-slate-400 outline-none">
                                <button onclick="window.open('${DEFAULT_DRIVE_FOLDER}', '_blank')" class="p-3 bg-monster/10 border border-monster/20 text-monster rounded-xl hover:bg-monster/20 transition-all shadow-lg shadow-monster/10"><i data-lucide="external-link" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            lucide.createIcons();
        };

        // ==========================================
        // HANDLERS (LOGIKA TOMBOL & INPUT)
        // ==========================================

        window.navigate = function(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-monster'); btn.classList.add('text-slate-400'); });
            const act = document.getElementById(`nav-${view}`);
            if(act) { act.classList.remove('text-slate-400'); act.classList.add('text-monster'); }
            
            if(view === 'dashboard') window.renderDashboard();
            else if(view === 'search') window.renderSearch();
            else if(view === 'input') window.renderInput();
            else if(view === 'drive') window.renderDrive();
            else if(view === 'settings') window.renderSettings();
        };

        window.handleFileChange = (el) => {
            const f = el.files[0];
            if(f) {
                document.getElementById('fileNameDisplay').innerText = f.name;
                document.getElementById('docName').value = f.name.substring(0, f.name.lastIndexOf('.'));
                const l = f.name.toLowerCase();
                let c = 'FILE';
                if(l.includes('sk') || l.includes('keputusan')) c = 'SK';
                else if(l.includes('tugas')) c = 'SURAT TUGAS';
                else if(l.includes('laporan')) c = 'LAPORAN';
                else if(l.includes('keuangan')) c = 'KEUANGAN';
                else if(l.includes('pegawai')) c = 'KEPEGAWAIAN';
                document.getElementById('docCategory').value = c;
            }
        };

        window.switchUploadMode = (m) => {
            window.activeUploadMode = m;
            const isF = m === 'file';
            document.getElementById('tab-file').className = isF ? "flex-1 py-3 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg transition-all" : "flex-1 py-3 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            document.getElementById('tab-link').className = !isF ? "flex-1 py-3 text-xs font-bold rounded-lg bg-monster text-darkBg shadow-lg transition-all" : "flex-1 py-3 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            document.getElementById('mode-file').classList.toggle('hidden', !isF);
            document.getElementById('mode-link').classList.toggle('hidden', isF);
        };

        window.autoDetectLink = (u) => {
            const l = u.toLowerCase();
            document.getElementById('linkCategory').value = (l.includes('sheets') || l.includes('excel')) ? 'DATA' : 'FILE';
        };

        window.handleUpload = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin mx-auto"></i>`;
            btn.disabled = true;
            lucide.createIcons();

            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

            try {
                if(window.activeUploadMode === 'file') {
                    const fInput = document.getElementById('fileInput');
                    const file = fInput.files[0];
                    if(!file) throw new Error("Pilih berkas!");
                    
                    // Ekstraksi Atribut Surat
                    const noSurat = document.getElementById('docNoSurat')?.value || '';
                    const sifat = document.getElementById('docSifat')?.value || '';
                    const hal = document.getElementById('docHal')?.value || '';
                    const yth = document.getElementById('docYth')?.value || '';
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        fetch(GAS_API_URL, { 
                            method: 'POST', 
                            body: JSON.stringify({ fileName: file.name, mimeType: file.type, fileData: event.target.result.split(',')[1] }),
                            headers: { 'Content-Type': 'text/plain' }
                        })
                        .then(res => res.json())
                        .then(async res => {
                            if(res.status === 'success') {
                                await push(ref(db, "arsip"), { 
                                    nama: file.name, 
                                    tipe: file.name.split('.').pop().toLowerCase(), 
                                    ukuran: (file.size / 1024 / 1024).toFixed(2) + " MB", 
                                    kategori: document.getElementById('docCategory').value, 
                                    noSurat: noSurat,
                                    sifat: sifat,
                                    hal: hal,
                                    yth: yth,
                                    url: res.url, 
                                    tanggal: dateStr, 
                                    createdAt: serverTimestamp() 
                                });
                                window.showToast('Berkas & Atribut Disimpan!'); 
                                window.fetchData();
                            } else { 
                                window.showToast("⚠️ Simpan Drive Ditolak", "error"); 
                            }
                        })
                        .catch(() => window.showToast("⚠️ Masalah Jaringan GAS", "error"))
                        .finally(() => resetBtn());
                    };
                    reader.readAsDataURL(file);
                } else {
                    const name = document.getElementById('linkName').value;
                    const url = document.getElementById('linkUrl').value;
                    if(!name || !url) throw new Error("Lengkapi data tautan!");
                    
                    await push(ref(db, "arsip"), { 
                        nama: name.toUpperCase(), 
                        tipe: 'link', 
                        ukuran: 'Akses Web', 
                        kategori: document.getElementById('linkCategory').value, 
                        url: url, 
                        tanggal: dateStr, 
                        createdAt: serverTimestamp() 
                    });
                    window.showToast('Tautan Berhasil Disimpan!'); 
                    window.fetchData(); 
                    resetBtn();
                }
            } catch(e) { 
                window.showToast("⚠️ " + e.message, "error"); 
                resetBtn(); 
            }
            function resetBtn() { btn.innerHTML = originalContent; btn.disabled = false; lucide.createIcons(); }
        };

        window.filterFiles = (q) => { 
            window.navigate('search'); 
            setTimeout(() => { const i = document.getElementById('searchInput'); if(i) { i.value = q; window.handleSearch(); } }, 100); 
        };

        window.handleSearch = () => {
            const i = document.getElementById('searchInput');
            if(!i) return;
            const q = i.value.toLowerCase();
            
            // Upgrade fitur pencarian agar bisa mendeteksi No Surat, Hal, dan Yth
            const res = window.dataArsip.filter(f => 
                f.nama.toLowerCase().includes(q) || 
                (f.kategori && f.kategori.toLowerCase().includes(q)) || 
                (f.tipe && f.tipe.toLowerCase().includes(q)) ||
                (f.noSurat && f.noSurat.toLowerCase().includes(q)) ||
                (f.hal && f.hal.toLowerCase().includes(q)) ||
                (f.yth && f.yth.toLowerCase().includes(q))
            );
            
            const container = document.getElementById('searchResults');
            if(container) container.innerHTML = res.length ? res.map(f => window.createFileCard(f)).join('') : `<div class="col-span-full text-center py-10 opacity-50"><p>Dokumen tidak ditemukan</p></div>`;
            lucide.createIcons();
        };

        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'error') {
                t.classList.remove('bg-monster');
                t.classList.add('bg-red-500', 'text-white');
                icon.setAttribute('data-lucide', 'alert-circle');
            } else {
                t.classList.remove('bg-red-500');
                t.classList.add('bg-monster', 'text-darkBg');
                icon.setAttribute('data-lucide', 'check-circle');
            }
            lucide.createIcons();

            t.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { 
                t.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                t.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        };

        window.saveDriveLink = (u) => localStorage.setItem('driveFolderUrl', u);
        window.openDriveLink = () => { 
            const u = localStorage.getItem('driveFolderUrl') || DEFAULT_DRIVE_FOLDER;
            window.open(u, '_blank'); 
        };

        window.onload = () => window.fetchData();
    </script>
</body>
</html>
